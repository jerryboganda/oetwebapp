name: Agent console lockfile refresh (one-off)

# One-off: regenerates agent-console/package-lock.json after a pin bump (no local installs, AGENTS.md compute rule).
# Runs only on the chore/cli-upgrade branch and commits the lockfile back to it. Delete after use.
on:
  push:
    branches: [chore/cli-upgrade]
    paths: ['.github/workflows/agent-console-lock-refresh.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the lockfile for the bumped pins
        working-directory: agent-console
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Show resolved versions
        working-directory: agent-console
        run: |
          node -e "const l=require('./package-lock.json').packages;for(const k of Object.keys(l).filter(k=>/node_modules\/@(openai\/codex|anthropic-ai\/claude-agent-sdk)/.test(k)))console.log(k,l[k].version)"
      - name: Commit the lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-console/package-lock.json
          git diff --cached --quiet && echo "lockfile unchanged" || git commit -m "chore(agent-console): refresh lockfile for Codex 0.160.0 + Claude Agent SDK 0.3.288 [skip ci]"
          git push origin HEAD:chore/cli-upgrade
