# Owner Agent Console stack (owner directive 2026-09-27; agent-console/CONTRACT.md §2 + §6).
#
# Its OWN compose project (never part of `oetwebsite`), so main Build & Deploy
# runs never recreate it and it never recreates the app. Deployed ONLY by
# .github/workflows/agent-console.yml, which runs, on the VPS:
#
#   docker compose --env-file /opt/oetwebapp/.deploy/agent-console.env \
#     -f /opt/oetwebapp/docker-compose.agent-console.yml up -d --no-build --wait
#
# Images are built on GitHub Actions and pulled (pull_policy: missing +
# `--no-build`); there is no `build:` section on purpose (AGENTS.md: VPS = deploy
# + serve only). Every ${…} below is interpolated from that --env-file; no
# service uses env_file:, so nothing else from the host env leaks in.
#
# NEVER `docker compose down -v` this project: the three volumes are external
# and hold the engine sign-ins, the workspace and the session store/audit.
name: oet-agent-console

x-proxy-hardening: &proxy-hardening
  pull_policy: missing
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  user: "10010:10010"
  oom_score_adj: 500
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  # Control plane (uid 0, reduced caps) + engines (uid 10002 via /usr/local/bin/as-agent).
  agent-console:
    image: ${AGENT_CONSOLE_IMAGE:?Set AGENT_CONSOLE_IMAGE in agent-console.env}
    container_name: oet-agent-console
    hostname: oet-agent-console
    pull_policy: missing
    restart: unless-stopped
    init: true
    # Lets the control plane interrupt engines and flush the session store.
    stop_grace_period: 60s
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 1.5
    pids_limit: 512
    # Shared VPS: under host memory pressure the kernel must pick this
    # container long before oet-postgres or the API slots.
    oom_score_adj: 800
    environment:
      NODE_ENV: production
      TZ: UTC
      OWNER_AGENT_OWNER_ACCOUNT_IDS: ${OWNER_AGENT_OWNER_ACCOUNT_IDS:?Set OWNER_AGENT_OWNER_ACCOUNT_IDS in agent-console.env}
      OWNER_AGENT_CODEX_WORKSPACE_ID: ${OWNER_AGENT_CODEX_WORKSPACE_ID:-}
      OET_AGENT_DATABASE_URL: ${OET_AGENT_DATABASE_URL:?Set OET_AGENT_DATABASE_URL in agent-console.env}
      OWNER_AGENT_INTERNAL_TOKEN_FILE: /run/secrets/owner_agent_internal_token
      OWNER_AGENT_PROXY_TOKEN_FILE: /run/secrets/owner_agent_proxy_token
      # Names below are the ones agent-console/src/config.ts reads.
      AGENT_CONSOLE_EGRESS_PROXY: http://oet-agent-egress:3128
      DOCKER_HOST: tcp://oet-agent-dockerproxy:2375
      # Written by agent-console.yml when new images are pulled while turns are
      # active; its presence drives ConsoleStatus.updatePending.
      AGENT_CONSOLE_UPDATE_PENDING_FILE: /var/lib/oet-agent/update-pending
      OET_AGENT_IMAGE: ${AGENT_CONSOLE_IMAGE}
      # Container-level defaults for SSH break-glass (`docker exec -u agent … claude
      # auth login`, runbook §8.3): reach the vendors through the egress proxy.
      # Engine/tool children never inherit these; src/env.ts builds their env
      # (per-session proxy URL) from an allow-list. HOME comes from the `agent`
      # passwd entry; CLAUDE_CONFIG_DIR / CODEX_HOME are set in the image.
      HTTPS_PROXY: http://oet-agent-egress:3128
      HTTP_PROXY: http://oet-agent-egress:3128
      NO_PROXY: oet-agent-console,oet-agent-dockerproxy,oet-agent-dbproxy,localhost,127.0.0.1
    secrets:
      - owner_agent_internal_token
      - owner_agent_proxy_token
    volumes:
      - oet_agent_home:/home/agent
      - oet_agent_workspace:/workspace
      # Session store, ship state and the deploy's update-pending marker
      # (/var/lib/oet-agent/update-pending) live on this volume.
      - oet_agent_sessions:/var/lib/oet-agent
      - /opt/oetwebapp:/opt/oetwebapp:ro
    networks:
      - oet_agent_ctl
      - oet_agent_net
    depends_on:
      agent-egress:
        condition: service_healthy
      agent-dockerproxy:
        condition: service_healthy
      agent-dbproxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:8410/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  # The ONLY container of this stack with an internet route (allowlist CONNECT proxy).
  agent-egress:
    <<: *proxy-hardening
    image: ${AGENT_EGRESS_IMAGE:?Set AGENT_EGRESS_IMAGE in agent-console.env}
    container_name: oet-agent-egress
    hostname: oet-agent-egress
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      NODE_ENV: production
      TZ: UTC
      EGRESS_LISTEN_PORT: "3128"
      OWNER_AGENT_PROXY_TOKEN_FILE: /run/secrets/owner_agent_proxy_token
      OWNER_AGENT_APPROVAL_URL: http://oet-agent-console:8410/internal/approvals
    secrets:
      - owner_agent_proxy_token
    networks:
      - oet_agent_net
      - oet_agent_egress
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 4 -O /dev/null http://127.0.0.1:3128/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Sole holder of the Docker socket; policy per CONTRACT.md §6.
  agent-dockerproxy:
    <<: *proxy-hardening
    image: ${AGENT_DOCKERPROXY_IMAGE:?Set AGENT_DOCKERPROXY_IMAGE in agent-console.env}
    container_name: oet-agent-dockerproxy
    hostname: oet-agent-dockerproxy
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in agent-console.env}"
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128
    environment:
      NODE_ENV: production
      TZ: UTC
      DOCKERPROXY_LISTEN_PORT: "2375"
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      OWNER_AGENT_PROXY_TOKEN_FILE: /run/secrets/owner_agent_proxy_token
      OWNER_AGENT_APPROVAL_URL: http://oet-agent-console:8410/internal/approvals
    secrets:
      - owner_agent_proxy_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - oet_agent_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 4 -O /dev/null http://127.0.0.1:2375/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Stock TCP forwarder: agent → oet-agent-dbproxy:5432 → oet-postgres:5432.
  # Credentials are the oet_owner_agent role (scripts/ops/create-owner-agent-db-role.sql).
  agent-dbproxy:
    <<: *proxy-hardening
    image: alpine/socat:1.8.1.3@sha256:5ffbd6ae916cbad86a58fabe0d6d5a6fd5c2b47ddf031e82996baac9300e732f
    container_name: oet-agent-dbproxy
    hostname: oet-agent-dbproxy
    user: "65534:65534"
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 64
    command:
      - -d
      - TCP-LISTEN:5432,fork,reuseaddr,max-children=16
      - TCP:oet-postgres:5432,connect-timeout=10
    networks:
      - oet_agent_net
      - oetwebsite_internal
    healthcheck:
      # Probes the local listener (socat forks a child that connects to
      # postgres and closes without sending a startup packet).
      test: ["CMD", "socat", "-u", "OPEN:/dev/null", "TCP:127.0.0.1:5432,connect-timeout=3"]
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3

secrets:
  owner_agent_internal_token:
    file: /opt/oetwebapp/.deploy/agent-console-secrets/owner_agent_internal_token
  owner_agent_proxy_token:
    file: /opt/oetwebapp/.deploy/agent-console-secrets/owner_agent_proxy_token

# External + exact names so compose can never create an empty parallel volume
# or remove one on `down`. Created (if absent) by agent-console.yml and listed
# in scripts/deploy/protect-production-data.sh.
volumes:
  oet_agent_home:
    external: true
    name: oet-agent-console_oet_agent_home
  oet_agent_workspace:
    external: true
    name: oet-agent-console_oet_agent_workspace
  oet_agent_sessions:
    external: true
    name: oet-agent-console_oet_agent_sessions

networks:
  # API slots ↔ sidecar :8410. internal: no gateway, no internet. Created by
  # agent-console.yml (and auto-deploy-ghcr.sh) with `docker network create --internal`.
  oet_agent_ctl:
    external: true
    name: oet_agent_ctl
  # Sidecar ↔ egress / dockerproxy / dbproxy. internal, created by agent-console.yml.
  oet_agent_net:
    external: true
    name: oet_agent_net
  # Internet route for agent-egress ONLY.
  oet_agent_egress:
    name: oet_agent_egress
    driver: bridge
  # The app's network, for agent-dbproxy → oet-postgres only.
  oetwebsite_internal:
    external: true
    name: oetwebsite_internal
