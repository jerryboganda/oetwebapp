name: Speaking live voice E2E (production)

# Manually dispatched production smoke of the live AI patient: a real browser,
# a fake microphone playing a scripted candidate, the real learner pages and
# the real live voice provider (Gemini Live or OpenAI GPT-Live). Uses the
# dedicated QA learner account. Emits provider usage, latency, stability and
# the patient's audio as artifacts so providers can be compared like for like.
# One run at a time: the QA learner has a single session and every run bills real AI usage.
# Dispatch from a branch (gh workflow run speaking-live-voice-prod-e2e.yml --ref the-branch), never by merging to main:
# every push to main redeploys production. The first step refuses to start while a deploy is running or queued.
# The artifact holds QA transcripts, the patient's audio and screenshots, so it is kept for 3 days only.
concurrency:
  group: speaking-live-voice-prod-e2e
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      mode:
        description: practice (one card) or exam (Card A + Card B mock)
        type: choice
        options: [practice, exam]
        default: practice
      card_id:
        description: Role-play card id for practice mode (must match the QA learner's profession)
        required: false
        default: rpc-54dc0a57ec3d4a97978b690379edd2d9
      script:
        description: Candidate script (scripts/qa/speaking-candidate-scripts/<name>.txt). compare and full-lactose are written for the lactose practice card, not for exam mode. smoke-A and smoke-B are smoke with a different closing sentence, to tell two runs apart. opening-control checks the patient waits to be invited (a greeting, a name and a seat are not an invitation) and is short, for practice mode.
        type: choice
        options: [short, full-lactose, generic, smoke, smoke-A, smoke-B, compare, opening-control]
        default: short
      voice:
        description: Candidate TTS voice (piper = natural neural en-GB; espeak = robotic)
        type: choice
        options: [piper, espeak]
        default: piper
      speak_seconds:
        description: Seconds of live conversation before submitting (practice mode). Blank = the candidate tape's last speech + 10 s (max 280, the app auto-ends at 5:00).
        required: false
        default: ''
      voice_provider:
        description: Live voice provider this run asks the server to pin (blank = the server's candidates, configured primary first and health only filters). The server honours a pin only for a QA learner with an enabled feature flag speaking_live_voice_pin:<learner user id>, and the run fails fast naming that flag when it did not. A pinned provider never fails over.
        type: choice
        options: ['', gemini, openai]
        default: ''
      expected_primary:
        description: Provider this unpinned run should try first (blank = no assertion). Fails the run if the app's first provider call goes elsewhere. Ignored (metrics.json says so) when voice_provider pins a provider.
        type: choice
        options: ['', gemini, openai]
        default: ''
      fail_primary:
        description: Answer the expected primary's create call with a 503 in the browser and assert the app fails over to the other provider (needs expected_primary, blank voice_provider). Works with the fault inputs, the fault then hits the fallback provider. The API never sees the faked failure, so only the client failover is exercised.
        type: boolean
        default: false
      fault_drop_at_s:
        description: Recovery run, blank = off. This many seconds after the candidate microphone tape starts, kill the live provider connection from inside the page (Gemini closes its WebSocket, OpenAI its data channel) and assert the app recovers on a new session. Needs a blank voice_provider (a pinned provider never recovers). Works with fail_primary.
        type: string
        default: ''
      fault_stall_at_s:
        description: Recovery run, blank = off. This many seconds after the candidate microphone tape starts, make the provider go silent (every server message is swallowed until the app builds a new session) and assert the app recovers. Same rules as fault_drop_at_s, which wins when both are set.
        type: string
        default: ''
      fault_reload_at_s:
        description: Refresh run, blank = off. This many seconds after the candidate microphone tape starts, refresh the page, press Start speaking if the panel does not reconnect by itself, and record what the product did. Also checks that the words said before the refresh are in the saved transcript. Allowed with a pinned voice_provider. The drop and stall inputs win over it when set.
        type: string
        default: ''
      verify_credits:
        description: Read the QA learner's AI credits before the run starts (it refuses to start when funded by a mock exam unit, unlimited Speaking, a free sample or too few credits), at each card hold, after grading and at the end. Asserts the exact charge once (4 for an exam, 2 for practice), the exact ledger rows and no refund, then checks the History page.
        type: boolean
        default: false
      grade_retry:
        description: After grading, ask for the grade once more per card and assert it is a no-op (HTTP 200 or 202, the same assessment, the credit ledger unchanged).
        type: boolean
        default: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Read-only: the first step lists deploy runs, checkout reads the repo.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Refuse to run while a production deploy is running or queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow production-deploy.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != 0 ]; then
            echo "::error::production-deploy.yml has $busy run(s) in progress or queued. A deploy restarts the API (and its in-memory provider breaker) in the middle of a run. Wait for it to finish, then dispatch again."
            exit 1
          fi
      - name: Reject a card-specific script in exam mode
        run: |
          if [ "${{ inputs.mode }}" = exam ] && { [ "${{ inputs.script }}" = compare ] || [ "${{ inputs.script }}" = full-lactose ]; }; then
            echo "::error::compare and full-lactose are written for the lactose practice card; exam mode draws its own cards. Use smoke, generic or short."
            exit 1
          fi
      - name: Reject a failover run that cannot fail over
        run: |
          if [ "${{ inputs.fail_primary }}" = true ] && { [ -z "${{ inputs.expected_primary }}" ] || [ -n "${{ inputs.voice_provider }}" ]; }; then
            echo "::error::fail_primary needs expected_primary (the provider to fail) and a blank voice_provider: a pinned provider never fails over."
            exit 1
          fi
      - name: Reject a fault run that cannot recover
        # Free-text inputs reach the script through env, never through its text.
        env:
          FAULT_DROP_AT_S: ${{ inputs.fault_drop_at_s }}
          FAULT_STALL_AT_S: ${{ inputs.fault_stall_at_s }}
          FAULT_RELOAD_AT_S: ${{ inputs.fault_reload_at_s }}
          VOICE_PROVIDER: ${{ inputs.voice_provider }}
        run: |
          for v in "$FAULT_DROP_AT_S" "$FAULT_STALL_AT_S" "$FAULT_RELOAD_AT_S"; do
            if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "::error::fault_drop_at_s, fault_stall_at_s and fault_reload_at_s must be a number of seconds, for example 40."
              exit 1
            fi
          done
          if [ -n "$FAULT_DROP_AT_S$FAULT_STALL_AT_S" ] && [ -n "$VOICE_PROVIDER" ]; then
            echo "::error::A drop or stall run needs a blank voice_provider (a pinned provider never recovers, so the fault would only kill the session). A reload run may pin one."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Candidate voice (16 kHz mono, 6 s lead-in, 8 s gap after each line unless [after=N]) + timeline
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng sox >/dev/null
          if [ "${{ inputs.voice }}" = piper ]; then
            # Piper: free offline neural TTS (rhasspy/piper), British English voice.
            curl -sSL -o piper.tgz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
            tar -xzf piper.tgz
            curl -sSL -o voice.onnx https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/alan/medium/en_GB-alan-medium.onnx
            curl -sSL -o voice.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_GB/alan/medium/en_GB-alan-medium.onnx.json
          fi
          # The fake mic starts when the page opens the microphone, 1-2.5 s before the provider is
          # live: 6 s of leading silence keeps the greeting from being clipped (and the tape plays once).
          lead=6
          sox -n -r 16000 -c 1 -b 16 lead.wav trim 0 $lead
          i=0; t=$lead; echo '[' > timeline.json
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # "[after=N] text" = N seconds of silence after this line (barge-in / pause tests).
            gap=8
            if [[ "$line" =~ ^\[after=([0-9.]+)\]\ *(.*)$ ]]; then gap="${BASH_REMATCH[1]}"; line="${BASH_REMATCH[2]}"; fi
            if [ "${{ inputs.voice }}" = piper ]; then
              echo "$line" | ./piper/piper --model voice.onnx --output_file "l$i.wav" >/dev/null 2>&1
            else
              espeak-ng -v en-gb -s 150 -w "l$i.wav" "$line"
            fi
            sox "l$i.wav" -r 16000 -c 1 -b 16 "s$i.wav"
            d=$(soxi -D "s$i.wav")
            sox "s$i.wav" "p$i.wav" pad 0 "$gap"
            [ $i -gt 0 ] && echo ',' >> timeline.json
            echo "{\"start\": $t, \"end\": $(awk "BEGIN{printf \"%.3f\", $t + $d}")}" >> timeline.json
            t=$(awk "BEGIN{printf \"%.3f\", $t + $(soxi -D "p$i.wav")}")
            i=$((i+1))
          done < "scripts/qa/speaking-candidate-scripts/${{ inputs.script }}.txt"
          echo ']' >> timeline.json
          sox lead.wav $(ls p*.wav | sort -V) candidate.wav
          soxi candidate.wav
          node -e "JSON.parse(require('fs').readFileSync('timeline.json','utf8'))"
      - name: Playwright Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-save --silent playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run
        env:
          QA_EMAIL: ${{ secrets.QA_SPEAKING_LEARNER_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_SPEAKING_LEARNER_PASSWORD }}
          QA_DEVICE_ID: ${{ secrets.QA_SPEAKING_LEARNER_DEVICE_ID }}
          MODE: ${{ inputs.mode }}
          CARD_ID: ${{ inputs.card_id }}
          SPEAK_SECONDS: ${{ inputs.speak_seconds }}
          VOICE_PROVIDER: ${{ inputs.voice_provider }}
          EXPECTED_PRIMARY: ${{ inputs.expected_primary }}
          FAIL_PRIMARY: ${{ inputs.fail_primary }}
          FAULT_DROP_AT_S: ${{ inputs.fault_drop_at_s }}
          FAULT_STALL_AT_S: ${{ inputs.fault_stall_at_s }}
          FAULT_RELOAD_AT_S: ${{ inputs.fault_reload_at_s }}
          VERIFY_CREDITS: ${{ inputs.verify_credits }}
          GRADE_RETRY: ${{ inputs.grade_retry }}
          CANDIDATE_WAV: ${{ github.workspace }}/candidate.wav
          CANDIDATE_TIMELINE: ${{ github.workspace }}/timeline.json
          SCRIPT_NAME: ${{ inputs.script }}
          VOICE: ${{ inputs.voice }}
          SCRIPT_FILE: scripts/qa/speaking-candidate-scripts/${{ inputs.script }}.txt
        run: cp scripts/qa/speaking-live-voice-browser-e2e.mjs /tmp/pw/e2e.mjs && cp scripts/qa/live-voice-browser-probes.mjs scripts/qa/live-voice-served-provider.mjs scripts/qa/live-voice-transcript-quality.mjs scripts/qa/live-voice-opening-control.mjs /tmp/pw/ && node /tmp/pw/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-voice-e2e
          retention-days: 3
          path: |
            live-voice-e2e/
            timeline.json
            candidate.wav
