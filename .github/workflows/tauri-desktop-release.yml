name: Tauri Desktop Release

# Builds the Tauri 2 desktop shell (src-tauri/) for Windows (NSIS) and macOS
# Universal dmg (Intel x64 + Apple Silicon arm64 via --target universal-apple-darwin).
# The shell is a remote-only thin client: it bundles no backend, no Next.js
# renderer, and no Node runtime, so the build is just `tauri build` (Rust core +
# a tiny bundled splash). See docs/tauri-desktop-shell.md.
#
# Triggers:
#  - Manual: workflow_dispatch with version + allow_unsigned inputs; successful
#    signed builds publish the same updater feed as tag runs.
#  - Tag push: v*.*.*-tauri-desktop (e.g. v1.2.0-tauri-desktop) builds and uploads
#    artifacts and publishes the updater feed to the production VPS.
#
# Required repository secrets:
#  - TAURI_SIGNING_PRIVATE_KEY           — minisign private key for updater artifacts
#                                          (generate: pnpm dlx @tauri-apps/cli signer generate;
#                                          the matching pubkey lives in src-tauri/tauri.conf.json)
#  - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password ('' if none)
#  - WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD (optional) — base64-encoded
#    PFX + its password for Windows Authenticode code-signing. When set, the
#    Windows leg imports the cert into CurrentUser\My, reads back its thumbprint,
#    and stamps bundle.windows.certificateThumbprint (+ digestAlgorithm/timestampUrl)
#    into tauri.conf.json before `tauri build`, so the NSIS installer is signed
#    with a SHA-256 digest and an RFC3161 timestamp automatically. If unset, the
#    Windows build proceeds unsigned (no code changes needed either way).
#  macOS signing/notarisation (optional): APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#  APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (tauri-cli reads these).
#
# NOTE: a green macOS build here does NOT discharge the migration plan's macOS
# gate — WKWebView microphone capture needs a one-time manual run on real
# hardware (no audio input or interactive permission prompts on CI runners).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to stamp into src-tauri/tauri.conf.json (e.g. 1.2.0)'
        required: true
        type: string
      allow_unsigned:
        description: 'Allow build without updater signing key (artifacts cannot be served to the auto-updater)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*-tauri-desktop'

concurrency:
  group: tauri-desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  conformance:
    name: Bridge conformance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: desktopBridge contract conformance (types/desktop.d.ts parity)
        run: pnpm vitest run src-tauri/__tests__/desktop-bridge-conformance.test.ts

  build:
    name: ${{ matrix.platform.name }}
    needs: conformance
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64 (NSIS)
            os: windows-latest
            bundle-glob: src-tauri/target/release/bundle/nsis/*
          - name: macOS Universal (Intel + Apple Silicon) (dmg)
            os: macos-latest
            bundle-glob: src-tauri/target/**/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    steps:
      # Repo has content files with paths > Windows MAX_PATH (260); enable long
      # paths before checkout so the Windows runner can write them.
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust targets for macOS Universal (Intel + Apple Silicon)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
            v="${tag#v}"; v="${v%-tauri-desktop}"
          else
            v="${{ inputs.version }}"
          fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.\-]+)?$'; then
            echo "Resolved version '$v' is not valid semver." >&2; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved tauri desktop version: $v"

      - name: Stamp tauri.conf.json version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(p, 'utf8'));
            conf.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Stamp Cargo.toml version
        shell: bash
        run: |
          # Keep the crate version in lockstep with tauri.conf.json so
          # env!("CARGO_PKG_VERSION") (used by runtime_info + updater_check)
          # reports the shipped version. Only the [package] version is touched;
          # dependency lines are keyed by crate name, not a bare `version =`.
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/Cargo.toml';
            let toml = fs.readFileSync(p, 'utf8');
            toml = toml.replace(/^version = \"[^\"]*\"/m, 'version = \"${{ steps.version.outputs.version }}\"');
            fs.writeFileSync(p, toml);
          "

      - name: Validate updater signing configuration
        if: inputs.allow_unsigned != true
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is not configured. The auto-updater" >&2
            echo "refuses unsigned artifacts. Re-run with allow_unsigned=true for throwaway builds." >&2
            exit 1
          fi
          echo "Updater signing key detected."

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows'
        id: import-cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host "No WINDOWS_CERTIFICATE secret set - skipping Authenticode import."
            Write-Host "NOTE: installer code-signing is disabled (no certificateThumbprint will be"
            Write-Host "stamped into tauri.conf.json), so the Windows build produces an UNSIGNED"
            Write-Host "NSIS installer. See README 'Desktop signing' to enable Authenticode."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP 'oet-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          # A signing PFX can bundle intermediate/chain certs alongside the leaf
          # cert, so Import-PfxCertificate may return more than one object here.
          # Only the leaf cert carries the private key signtool needs - pick that
          # one explicitly rather than trusting array/member-enumeration order.
          $cert = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          if (-not $cert) {
            Write-Error "Imported PFX did not yield a certificate with a private key - cannot sign with it."
            exit 1
          }
          Write-Host "Imported code-signing certificate into CurrentUser\My."
          Write-Host "Subject: $($cert.Subject)  Thumbprint: $($cert.Thumbprint)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "thumbprint=$($cert.Thumbprint)"

      # Wires the cert imported above into the actual build: Tauri's Windows
      # bundler signs the NSIS installer natively (via signtool, which it
      # locates on the runner itself) when bundle.windows.certificateThumbprint
      # is set. The committed tauri.conf.json intentionally has no thumbprint
      # (so local/dev builds stay unsigned without a cert in the store) — this
      # stamps it in on the runner only, same pattern as the version stamp above.
      - name: Stamp Windows Authenticode signing config
        if: runner.os == 'Windows' && steps.import-cert.outputs.thumbprint != ''
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(p, 'utf8'));
            conf.bundle.windows = conf.bundle.windows || {};
            conf.bundle.windows.certificateThumbprint = '${{ steps.import-cert.outputs.thumbprint }}';
            conf.bundle.windows.digestAlgorithm = 'sha256';
            conf.bundle.windows.timestampUrl = 'http://timestamp.digicert.com';
            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + '\n');
          "
          echo "Stamped certificateThumbprint into bundle.windows - installer will be signed during bundling."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + bundle (tauri build — remote-only shell)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Video playback attestation secret (64-hex chars) — embedded into the
          # Rust binary at COMPILE time via option_env!. Release builds without it
          # still compile but sign_video_challenge returns an error at runtime
          # ("attestation secret not embedded"); dev builds fall back to the
          # public dev constant.
          OET_DESKTOP_ATTEST_SECRET: ${{ secrets.OET_DESKTOP_ATTEST_SECRET }}
          # The shell loads the remote web app over HTTPS — there is no Next.js or
          # .NET build here. The remote URLs live in src-tauri/desktop-runtime-config.json.
          # macOS is built UNSIGNED (no Apple Developer ID, per the QA decision).
          # Do NOT pass empty APPLE_* env — tauri treats an empty APPLE_CERTIFICATE
          # as "import this cert" and fails ("security import ... not valid").
          # To enable macOS signing later, add the APPLE_* secrets and map them here.
        run: node scripts/tauri-dist.cjs build

      - name: Generate checksums
        shell: bash
        run: |
          set -e
          # Use `find` (not bash `globstar`) — macOS runners ship bash 3.2 where
          # `shopt -s globstar` is unavailable. Search the whole target tree so
          # both `release` (Windows) and `universal-apple-darwin/release`
          # (macOS Universal) are found.
          mkdir -p dist/tauri-desktop
          found=0
          while IFS= read -r f; do
            cp "$f" dist/tauri-desktop/ && found=1
          done < <(find src-tauri/target -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.sig' -o -name '*.app.tar.gz' \))
          if [ "$found" -eq 0 ]; then
            echo "No bundle artifacts found for checksum generation." >&2; exit 1
          fi
          cd dist/tauri-desktop
          if command -v sha256sum >/dev/null; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-${{ runner.os }}-${{ steps.version.outputs.version }}
          path: dist/tauri-desktop/
          if-no-files-found: error
          retention-days: 90

  # Gather platform artifacts, build a production updater feed, and publish
  # only that latest desktop release to the VPS. Older VPS copies are deleted.
  publish:
    name: Publish VPS updater feed
    needs: build
    # Run on tag push even if a build leg failed (e.g. macOS), as long as the
    # run wasn't cancelled. The Windows installer is required (the latest.json
    # step fails if its artifact is missing); the macOS dmg is best-effort.
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.allow_unsigned != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"; v="${tag#v}"; v="${v%-tauri-desktop}"
          else
            v="${{ inputs.version }}"; tag="v${v}-tauri-desktop"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble production updater feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          node scripts/release/assemble-desktop-feed.mjs \
            --version="${{ steps.version.outputs.version }}" \
            --artifact-dir=artifacts \
            --public-base=https://app.oetwithdrhesham.co.uk \
            --out=stage/current.json
          while IFS= read -r file; do
            cp "$file" "stage/$(basename "$file" | sed -E 's/[[:space:]]+/./g; s/\.+/./g')"
          done < <(find artifacts -type f \( -name '*-setup.exe' -o -name '*-setup.exe.sig' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \))
          cp -f stage/current.json stage/latest.json
          echo "Staged desktop release:"; ls -la stage; cat stage/current.json

      - name: Upload latest desktop release to the VPS
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          CHANNEL: desktop
          VERSION: ${{ steps.version.outputs.version }}
          SRC_DIR: stage
        run: bash scripts/release/upload-native-release.sh

      - name: Verify production updater feed and artifact
        shell: bash
        run: |
          set -euo pipefail
          feed="https://app.oetwithdrhesham.co.uk/desktop/updates/latest.json"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location "$feed" -o published-latest.json; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const feed = JSON.parse(fs.readFileSync('published-latest.json', 'utf8'));
          if (feed.version !== '${{ steps.version.outputs.version }}') throw new Error('Published updater version mismatch');
          const win = feed.platforms?.['windows-x86_64'];
          if (!win?.signature || win.signature.length < 64) throw new Error('Published Windows updater signature is missing');
          if (!win.url?.startsWith('https://app.oetwithdrhesham.co.uk/releases/')) throw new Error('Published updater URL is untrusted');
          console.log(win.url);
          NODE
          artifact_url=$(node -p "require('./published-latest.json').platforms['windows-x86_64'].url")
          curl --fail --silent --show-error --location --range 0-0 "$artifact_url" -o /dev/null
