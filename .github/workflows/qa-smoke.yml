name: QA Smoke

# Unit + backend evidence only. Owner directive 2026-10-03 (HARD PROJECT RULE):
# there are NO Playwright/e2e jobs in CI. The specs under tests/e2e/** stay in the
# repo as manual tools; the owner reports a regression and the agent fixes it on
# demand. Do not re-add e2e jobs, e2e images or a nightly e2e schedule here.
#
# Owner directive 2026-10-03 (minimum time from deploy to ship): the 6-way
# backend matrix is PATH-FILTERED. It costs ~40 minutes of wall clock and holds
# the repo public while it runs, so it only runs when a backend input actually
# changed — a frontend-only push would otherwise pay for six .NET shards it
# cannot affect. Force it with `gh workflow run qa-smoke.yml -f backend=always`
# (or skip it on purpose with -f backend=skip).

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'ops/**'
      - '.github/agent-state.local.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'ops/**'
      - '.github/agent-state.local.md'
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend .NET matrix: auto = only when backend inputs changed'
        type: choice
        default: auto
        options:
          - auto
          - always
          - skip

permissions:
  contents: read

concurrency:
  group: qa-smoke-${{ github.workflow }}-${{ github.ref }}
  # Main pushes must FINISH: agents need green evidence for their SHA (the old
  # cancel-in-progress killed in-flight runs on every push - run 36953672205 was
  # CANCELLED wholesale). PRs still auto-cancel; a newer commit replaces the old.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One cheap classification job, same idiom as build-images.yml: the compare
  # API answers in a second where a full-history clone takes ~30s, and the
  # backend matrix waits on this one.
  changes:
    name: Detect what changed
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
    steps:
      - id: detect
        name: Classify the push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          all=0
          BASE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" != "push" ]; then
            all=1
          fi
          if [ -z "$BASE" ] || printf '%s' "$BASE" | grep -qE '^0+$'; then all=1; fi
          FILES=""
          if [ "$all" = "0" ]; then
            JSON="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${{ github.sha }}")"
            FILES="$(printf '%s' "$JSON" | jq -r '.files[].filename')"
            # The compare API truncates at 300 files; assume everything changed
            # rather than under-report an input.
            if [ "$(printf '%s' "$JSON" | jq -r '.files | length')" -ge 300 ]; then all=1; fi
          fi
          if [ "$all" = "1" ]; then
            echo "No usable diff range (first push / manual dispatch / truncated compare) - treating every input as changed."
            backend=true
            FILES="(all)"
          else
            has() { printf '%s\n' "$FILES" | grep -Eq "$1"; }
            # true/false strings on purpose: the job condition compares to 'true'.
            backend=false
            # Everything the .NET test host compiles or seeds with: the solution
            # itself, the EF model inputs (global.json, Directory.*.props,
            # NuGet.config), the seed/embedded data the API bakes
            # (data/**, rulebooks/**), and this workflow, so a change to the
            # matrix is always proven by the matrix.
            if has '^(backend/|data/|rulebooks/|global\.json$|Directory\.[A-Za-z]+\.props$|NuGet\.config$|\.github/workflows/qa-smoke\.yml$)'; then backend=true; fi
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend"
          {
            echo "### Change detection"
            echo "- backend=$backend"
            echo '```'
            printf '%s\n' "$FILES" | head -n 200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  placement-entry:
    name: Placement entry contracts
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify placement return destinations
        run: pnpm exec vitest run lib/__tests__/auth-routes.test.ts --reporter=verbose

  backend-tests:
    name: Backend tests (.NET) · shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    # Path-filtered (owner directive 2026-10-03): a frontend-only push skips the
    # whole matrix. `-f backend=always` forces it, `-f backend=skip` suppresses it
    # — and qa-gate accepts a skipped matrix, never a failed one.
    if: ${{ inputs.backend == 'always' || (inputs.backend != 'skip' && needs.changes.outputs.backend == 'true') }}
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    # Postgres is step-started below, NOT a service container: GitHub service
    # `options` cannot pass server args, and the AI budget concurrency races
    # need max_connections above the pgvector image's default 100 — against
    # the stock 100, connection starvation fail-closes reservations as
    # budget_store_unavailable (the exact mechanism f175c382b fixed for
    # ai-control-plane-tests.yml, which recurred here in shard 1 on
    # 2026-10-03: 3/40 grants denied and the QA gate went red).
    # pgvector/pgvector, not plain postgres: LearnerDbContext declares
    # HasPostgresExtension("vector") for CompanionChunk.Embedding, and EF
    # validates the full model (not just whatever tables a given test
    # touches) the moment any code calls db.Database.* — Npgsql's
    # UseVector() plugin silently drops the vector type mapping when the
    # extension isn't installed, so every PostgreSqlFact test in this
    # matrix failed with "could not be mapped to the database type
    # vector(1536)" regardless of what it actually exercised. Same fix as
    # ai-control-plane-tests.yml (#213).
    # Per-shard cap. The full suite ran sequentially (the test assembly sets
    # [CollectionBehavior(DisableTestParallelization = true)] in AssemblyInfo.cs,
    # and the fixtures use isolated in-memory EF Core DBs — one unique
    # `InMemory:{Guid}` database per TestWebApplicationFactory — so there is NO
    # shared Postgres/Respawn state across classes). Because xunit will not
    # parallelize within a single process, parallelism comes from this matrix:
    # each shard is its own `dotnet test` process running a DISJOINT subset of
    # test CLASSES, so each finishes well under the cap. Shard 2 alone runs
    # ~38 min on main, so 40 left no headroom for any new test class.
    # Raised 60 -> 90 on 5 Oct 2026: adding one test class re-balanced the round-robin and shard 1 (which also
    # holds PlacementEndpointsTests) hit the 60-min cap and was cancelled; it had already needed ~49 min.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 6 disjoint shards (PlacementEndpointsTests + AuthFlowsTests alone are ~45 min of registrations). There is a single test project
        # (OetLearner.Api.Tests, one namespace per domain folder), so we shard by
        # round-robining distinct test CLASSES (not methods — keeps the
        # --filter compact) into N buckets via a stable, deterministic
        # partition computed at runtime from `dotnet test --list-tests`.
        shard: [1, 2, 3, 4, 5, 6]
    env:
      TOTAL_SHARDS: 6
      OET_TEST_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=oet_provider_tests;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      # Each shard used to download every NuGet package from scratch (6x per
      # run). The cache key follows the project files, so a restore is warm
      # after the first run for a lockstep of csproj changes.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      # Same idiom as ai-control-plane-tests.yml: a step-started container so
      # `-c max_connections=400` reaches the server (see the job-level comment).
      - name: Start Postgres (pgvector, max_connections=400)
        run: |
          docker run -d --name oet-qa-pg \
            -e POSTGRES_DB=oet_provider_tests \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            pgvector/pgvector:pg17 \
            -c max_connections=400
          # Poll from the HOST over TCP. The official entrypoint's temporary
          # init server listens on the unix socket only, so a socket-based
          # pg_isready (docker exec) reports "accepting connections" while the
          # real server is still restarting — which is exactly how the very
          # next psql died with "server closed the connection unexpectedly"
          # (shard 3, run 37149559513). A TCP probe can only succeed once the
          # real server is listening on 5432.
          for i in $(seq 1 30); do
            if PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d oet_provider_tests -c "SELECT 1;" >/dev/null 2>&1; then
              echo "Postgres ready (TCP) after ${i}s."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Postgres test container never became ready on TCP 5432." >&2
              docker logs oet-qa-pg 2>&1 | tail -50
              exit 1
            fi
            sleep 1
          done
      - name: Create the vector extension
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d oet_provider_tests -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/OetLearner.sln
      - name: Build (Release, once per shard)
        run: dotnet build backend/OetLearner.sln --configuration Release --no-restore --nologo
      - name: Compute test-class filter for this shard
        id: filter
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          TEST_PROJ="backend/tests/OetLearner.Api.Tests/OetLearner.Api.Tests.csproj"
          # Discover every fully-qualified test name without rebuilding, then
          # reduce to the set of distinct test CLASSES (strip the trailing
          # `.Method` and any `(args...)` theory data). Round-robin the sorted,
          # de-duplicated class list across TOTAL_SHARDS buckets so the split is
          # deterministic and balanced regardless of discovery order.
          dotnet test "$TEST_PROJ" \
            --configuration Release \
            --no-build \
            --nologo \
            --list-tests \
            | sed -n 's/^[[:space:]]\{4,\}\(.*\)$/\1/p' \
            | sed 's/(.*//' \
            | sed 's/\.[A-Za-z0-9_]*$//' \
            | sort -u > all-classes.txt

          TOTAL_CLASSES=$(wc -l < all-classes.txt | tr -d ' ')
          echo "Discovered $TOTAL_CLASSES distinct test classes."
          if [ "$TOTAL_CLASSES" -eq 0 ]; then
            echo "::error::No test classes discovered — failing rather than running an empty shard."
            exit 1
          fi

          # Round-robin: class on line i (1-based) belongs to shard ((i-1) % N)+1.
          # The two ~20-30 min classes are pinned to shards 1 and 2 so adding
          # test classes can never round-robin both into one shard (that blew
          # the 60-min cap on 23 Sep 2026).
          awk -v shard="$SHARD_INDEX" -v n="$TOTAL_SHARDS" '
            /\.PlacementEndpointsTests$/ { if (shard == 1) print; next }
            /\.AuthFlowsTests$/ { if (shard == 2) print; next }
            { i++; if (i % n == (shard - 1) % n) print }
          ' all-classes.txt > shard-classes.txt

          COUNT=$(wc -l < shard-classes.txt | tr -d ' ')
          echo "Shard $SHARD_INDEX owns $COUNT classes."
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Shard $SHARD_INDEX resolved to 0 classes."
            exit 1
          fi

          # Build a compact filter: FullyQualifiedName~Class1|FullyQualifiedName~Class2|...
          # `~` is a substring match anchored on the fully-qualified class name,
          # which is unambiguous because each line is a complete namespace+class.
          FILTER=$(awk '{ printf "%sFullyQualifiedName~%s", (NR==1 ? "" : "|"), $0 }' shard-classes.txt)
          {
            echo "value<<EOF"
            echo "$FILTER"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Test (shard ${{ matrix.shard }})
        run: |
          mkdir -p "test-results-shard-${{ matrix.shard }}"
          dotnet test backend/tests/OetLearner.Api.Tests/OetLearner.Api.Tests.csproj \
            --configuration Release \
            --no-build \
            --nologo \
            --verbosity normal \
            --filter "${{ steps.filter.outputs.value }}" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=results.trx" \
            --results-directory "test-results-shard-${{ matrix.shard }}"
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-shard-${{ matrix.shard }}
          path: test-results-shard-${{ matrix.shard }}/
          if-no-files-found: ignore
          retention-days: 14

  frontend-unit:
    name: Frontend unit (vitest + lint + tsc + build)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Turbopack/webpack build cache. The Docker build's cache mount does not
      # survive an ephemeral runner, so without this every CI `next build` is
      # cold; the cache key follows the lockfile + build config.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}
          restore-keys: next-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      # Mojibake guard. Report-only until the existing hits (mostly vendored
      # agent catalogs) are fixed; then drop continue-on-error.
      - name: Encoding guard (check:encoding)
        run: pnpm run check:encoding
        continue-on-error: true
      - run: pnpm run lint
      - run: pnpm exec vitest run --reporter=dot
      - run: pnpm run build

  qa-gate:
    name: QA gate (all suites green)
    if: always()
    needs: [changes, backend-tests, frontend-unit]
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Verify all dependencies succeeded
        run: |
          # A broken detector must never read as "nothing changed": fail closed.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::change detection failed"; exit 1
          fi
          # Skipped is not failed: the backend matrix is path-filtered and does
          # not run when no backend input changed (see the `changes` job).
          if [ "${{ needs.backend-tests.result }}" = "skipped" ]; then
            echo "Backend matrix skipped - no backend input changed (detected backend=${{ needs.changes.outputs.backend }})."
          elif [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "::error::backend-tests failed"; exit 1
          fi
          if [ "${{ needs.frontend-unit.result }}" != "success" ]; then
            echo "::error::frontend-unit failed"; exit 1
          fi
          echo "All QA gates passed."
