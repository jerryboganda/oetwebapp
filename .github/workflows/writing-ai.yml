# Build & push the Writing AI sidecar images (Claude + Codex) to GHCR.
#
# The VPS never builds (AGENTS.md compute policy): images are built here and
# pulled by docker-compose.writing-ai.yml with pull_policy: missing. Both
# sidecars layer a tiny facade onto the SAME base image as the owner
# agent-console (which already ships the verified `claude` / `codex` CLIs).

name: Writing AI sidecars

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'writing-ai-sidecars/**'
      - 'docker-compose.writing-ai.yml'
      - '.github/workflows/writing-ai.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: writing-ai-${{ github.ref }}
  cancel-in-progress: false

env:
  CLAUDE_IMAGE: ghcr.io/${{ github.repository }}-writing-claude:${{ github.sha }}
  CODEX_IMAGE: ghcr.io/${{ github.repository }}-writing-codex:${{ github.sha }}
  # Base image carrying the verified claude + codex CLIs. Pin to a known-good
  # agent-console tag; bump deliberately.
  AGENT_CONSOLE_IMAGE: ghcr.io/${{ github.repository }}-agent-console:latest
  # Sidecar default Codex model (owner 2026-10-02: GPT-6.1 Sol High). The backend always sends the
  # model; this is the fallback default, set in writing-ai.env by the deploy step below.
  WRITING_CODEX_MODEL: gpt-6.1-sol

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Images (sha + latest) are pushed ONLY from main; any other ref builds, loads and checks them.
      - name: Build & push Claude sidecar
        uses: docker/build-push-action@v6
        with:
          context: ./writing-ai-sidecars
          file: ./writing-ai-sidecars/claude/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          provenance: false
          build-args: |
            AGENT_CONSOLE_IMAGE=${{ env.AGENT_CONSOLE_IMAGE }}
          tags: |
            ${{ env.CLAUDE_IMAGE }}
            ghcr.io/${{ github.repository }}-writing-claude:latest
          cache-from: type=gha,scope=writing-claude
          cache-to: type=gha,mode=max,scope=writing-claude
      - name: Build & push Codex sidecar
        uses: docker/build-push-action@v6
        with:
          context: ./writing-ai-sidecars
          file: ./writing-ai-sidecars/codex/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          provenance: false
          build-args: |
            AGENT_CONSOLE_IMAGE=${{ env.AGENT_CONSOLE_IMAGE }}
          tags: |
            ${{ env.CODEX_IMAGE }}
            ghcr.io/${{ github.repository }}-writing-codex:latest
          cache-from: type=gha,scope=writing-codex
          cache-to: type=gha,mode=max,scope=writing-codex
      - name: Check built Codex CLI arguments without AI calls
        run: >-
          docker run --rm --network none --entrypoint codex "$CODEX_IMAGE"
          exec --skip-git-repo-check --ignore-user-config --json --model "$WRITING_CODEX_MODEL"
          -c 'model_reasoning_effort="high"' -c 'approval_policy="never"'
          -c 'sandbox_mode="read-only"' - --help
      # /home/agent is a writable named volume in production and must not exist in the image
      # (agent-console/Dockerfile), so a tmpfs stands in for it. Same check as writing-sidecars-test.yml.
      - name: Check claude auth status without network (signed out)
        run: |
          set -uo pipefail
          code=0
          out="$(timeout 60 docker run --rm --network none --tmpfs /home/agent:mode=1777 --entrypoint claude "$CLAUDE_IMAGE" auth status 2>&1)" || code=$?
          printf 'exit=%s\n%s\n' "$code" "$out"
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "::error::claude auth status exited $code (0 = signed in, 124 = hung); a fresh image must be signed out"
            exit 1
          fi
          printf '%s' "$out" | grep -Eq '"loggedIn"[[:space:]]*:[[:space:]]*false' \
            || { echo '::error::claude auth status printed no "loggedIn": false'; exit 1; }

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pull and health-gate exact-SHA Writing sidecars
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE_DIR="/tmp/oet-writing-rollout-${GITHUB_RUN_ID}"
          REMOTE_COMPOSE="$REMOTE_DIR/docker-compose.writing-ai.yml"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh_opts=(-i ~/.ssh/deploy_key -p 22 -o IdentitiesOnly=yes -o PasswordAuthentication=no -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=20)
          target="root@185.252.233.186"
          cleanup() {
            ssh "${ssh_opts[@]}" "$target" "rm -f '$REMOTE_COMPOSE' '$REMOTE_DIR/registry/config.json'; rmdir '$REMOTE_DIR/registry' '$REMOTE_DIR' 2>/dev/null || true" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ssh "${ssh_opts[@]}" "$target" "umask 077; mkdir -p '$REMOTE_DIR/registry'; cat > '$REMOTE_COMPOSE'; chmod 600 '$REMOTE_COMPOSE'" < docker-compose.writing-ai.yml
          printf '%s\n' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "$target" "docker --config '$REMOTE_DIR/registry' login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh "${ssh_opts[@]}" "$target" \
            "WRITING_CLAUDE_IMAGE='$CLAUDE_IMAGE' WRITING_CODEX_IMAGE='$CODEX_IMAGE' WRITING_CODEX_MODEL='$WRITING_CODEX_MODEL' WRITING_COMPOSE_FILE='$REMOTE_COMPOSE' DOCKER_CONFIG='$REMOTE_DIR/registry' bash -s" <<'DEPLOY'
          set -euo pipefail
          env_file="/opt/oetwebapp/.deploy/writing-ai.env"
          test -s "$env_file"
          previous_claude="$(docker inspect --format '{{.Config.Image}}' oet-writing-claude)"
          previous_codex="$(docker inspect --format '{{.Config.Image}}' oet-writing-codex)"
          compose() {
            docker compose --env-file "$env_file" -f "$WRITING_COMPOSE_FILE" "$@"
          }
          compose pull writing-claude writing-codex
          if ! compose up -d --no-build --no-deps --wait --wait-timeout 120 writing-claude writing-codex; then
            export WRITING_CLAUDE_IMAGE="$previous_claude" WRITING_CODEX_IMAGE="$previous_codex"
            compose up -d --no-build --no-deps --wait --wait-timeout 120 writing-claude writing-codex || true
            exit 1
          fi
          test "$(docker inspect --format '{{.Config.Image}}' oet-writing-claude)" = "$WRITING_CLAUDE_IMAGE"
          test "$(docker inspect --format '{{.Config.Image}}' oet-writing-codex)" = "$WRITING_CODEX_IMAGE"
          for setting in "WRITING_CLAUDE_IMAGE=$WRITING_CLAUDE_IMAGE" "WRITING_CODEX_IMAGE=$WRITING_CODEX_IMAGE" "WRITING_CODEX_MODEL=$WRITING_CODEX_MODEL"; do
            key="${setting%%=*}"
            if grep -q "^${key}=" "$env_file"; then
              sed -i "s#^${key}=.*#${setting}#" "$env_file"
            else
              printf '%s\n' "$setting" >> "$env_file"
            fi
          done
          install -m 600 "$WRITING_COMPOSE_FILE" /opt/oetwebapp/docker-compose.writing-ai.yml
          echo "DEPLOYED_CLAUDE_IMAGE=$WRITING_CLAUDE_IMAGE"
          echo "DEPLOYED_CODEX_IMAGE=$WRITING_CODEX_IMAGE"
          DEPLOY
