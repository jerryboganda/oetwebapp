name: AX Ledger Tools

# Proves the agent-ledger tooling in scripts/agent on GitHub Actions, the only
# authorized compute environment (AGENTS.md). The checker is static file reads
# plus read-only git/gh; its self-tests build throwaway git repos and need no
# network. Windows legs matter: the Claude Code hooks run on a Windows host.

on:
  push:
    paths:
      - 'scripts/agent/**'
      - 'scripts/ship/**'
      - '.github/workflows/ax-check.yml'
  pull_request:
    paths:
      - 'scripts/agent/**'
      - 'scripts/ship/**'
      - '.github/workflows/ax-check.yml'
  workflow_dispatch:

concurrency:
  group: ax-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-test:
    name: self-test (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux, node 22
            runner: ubuntu-latest
            node: 22
          - label: windows, node 22
            runner: windows-latest
            node: 22
          - label: windows, node 24
            runner: windows-latest
            node: 24

    steps:
      # Only scripts/agent is needed. A full checkout fails on Windows runners: one
      # tracked Medicine-pack PDF path exceeds the 260-character limit (the Tauri
      # jobs avoid it with core.longpaths; a sparse checkout never touches it).
      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Check out scripts/agent and the ship gate
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/agent
            scripts/ship

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Ledger checker self-test
        run: node scripts/agent/state.mjs --self-test

      - name: Hook adapter self-test
        run: node scripts/agent/hook.mjs --self-test

      - name: Ship gate self-test (includes the CLAUDE.md guard)
        run: node scripts/ship/pre-push-gate.mjs --self-test

      # The one-command ship wrapper: lock/lease/ledger-conflict/herald helpers.
      # Pure functions only - no git, no gh, no network.
      - name: Ship wrapper self-test
        run: node scripts/ship/ship.mjs --self-test

      - name: Watcher build selection on the native PowerShell engine
        shell: ${{ runner.os == 'Windows' && 'powershell' || 'pwsh' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          $path = Join-Path (Join-Path (Join-Path $pwd scripts) ship) watch-deploy.ps1
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw 'Watcher parse failed.' }
          $assignment = $ast.Find({ param($node)
            $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and $node.Left.Extent.Text -eq '$builds'
          }, $true)
          if (-not $assignment) { throw 'Actual watcher build selection missing.' }
          $release = '{"databaseId":1,"displayTitle":"Build images abc","status":"completed","conclusion":"success"}'
          $failed = $release.Replace('success', 'failure')
          $benchmark = $release.Replace('Build images', 'Benchmark build')
          $cases = @(
            @{ Raw = '[]'; Count = 0 },
            @{ Raw = "[$release]"; Count = 1; Conclusion = 'success' },
            @{ Raw = "[$benchmark]"; Count = 0 },
            @{ Raw = "[$($benchmark.Replace('success', 'failure')),$release]"; Count = 1; Conclusion = 'success' },
            @{ Raw = "[$benchmark,$failed]"; Count = 1; Conclusion = 'failure' }
          )
          foreach ($case in $cases) {
            $buildRaw = $case.Raw
            Invoke-Expression $assignment.Extent.Text
            if ($builds.Count -ne $case.Count) { throw 'Incorrect eligible build count.' }
            if ($case.Count -and ($builds[0].databaseId -ne 1 -or $builds[0].status -ne 'completed' -or $builds[0].conclusion -ne $case.Conclusion)) {
              throw 'Benchmark masked the actual release result.'
            }
          }
          Write-Output "WATCHER_BUILD_FILTER_OK engine=$($PSVersionTable.PSVersion) cases=$($cases.Count)"
