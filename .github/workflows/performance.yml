name: Performance Gates (staging + isolated)

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Use the disposable GitHub-hosted stack, or an explicitly configured non-production staging target'
        required: false
        default: ephemeral
        type: choice
        options:
          - ephemeral
          - external
      target_url:
        description: 'HTTPS non-production web URL; required only when mode=external'
        required: false
        type: string
      api_url:
        description: 'HTTPS non-production API URL; required only when mode=external'
        required: false
        type: string
      include_admin:
        description: 'Run the optional admin k6 read path using the injected staging token'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: performance-staging
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'
  PERF_MODE: ${{ inputs.mode || ((vars.PERF_TARGET_URL != '' && vars.PERF_API_URL != '') && 'external' || 'ephemeral') }}
  PERF_TARGET_URL: ${{ inputs.target_url || vars.PERF_TARGET_URL }}
  PERF_API_URL: ${{ inputs.api_url || vars.PERF_API_URL }}
  K6_INCLUDE_ADMIN: ${{ inputs.include_admin == true && '1' || '0' }}

jobs:
  performance:
    name: Browser and API performance gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve isolated performance targets
        if: env.PERF_MODE == 'ephemeral'
        run: |
          echo 'PERF_TARGET_URL=http://127.0.0.1:3000' >> "$GITHUB_ENV"
          echo 'PERF_API_URL=http://127.0.0.1:5198' >> "$GITHUB_ENV"

      - name: Validate explicit non-production targets
        if: env.PERF_MODE == 'external'
        run: |
          node --input-type=module <<'NODE'
          const values = [
            ['PERF_TARGET_URL', process.env.PERF_TARGET_URL],
            ['PERF_API_URL', process.env.PERF_API_URL],
          ];
          const blocked = ['app.oetwithdrhesham.co.uk', 'api.oetwithdrhesham.co.uk', '185.252.233.186'];
          for (const [name, value] of values) {
            if (!value) throw new Error(`${name} is not configured.`);
            const url = new URL(value);
            if (!['http:', 'https:'].includes(url.protocol)) throw new Error(`${name} must use HTTP or HTTPS.`);
            if (blocked.some((host) => url.hostname === host || url.hostname.endsWith(`.${host}`))) {
              throw new Error(`${name} points at a production host; staging performance workflow refused it.`);
            }
          }
          NODE

      - name: Build isolated staging-like stack
        if: env.PERF_MODE == 'ephemeral'
        run: |
          OET_PERF_APP_URL=https://127.0.0.1:3443 \
            docker compose -f docker-compose.desktop.yml up -d --build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Verify isolated stack readiness
        if: env.PERF_MODE == 'ephemeral'
        env:
          PLAYWRIGHT_READY_TIMEOUT_MS: '900000'
        run: node ./scripts/qa/assert-local-stack.mjs

      - name: Start isolated HTTPS browser proxy
        if: env.PERF_MODE == 'ephemeral'
        run: |
          mkdir -p output/performance/stack
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/oet-performance-proxy.key" \
            -out "$RUNNER_TEMP/oet-performance-proxy.crt" \
            -subj '/CN=127.0.0.1' \
            -days 1
          nohup node scripts/perf/https-proxy.mjs \
            --listen 3443 \
            --target http://127.0.0.1:3000 \
            --cert "$RUNNER_TEMP/oet-performance-proxy.crt" \
            --key "$RUNNER_TEMP/oet-performance-proxy.key" \
            > output/performance/stack/https-proxy.log 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/oet-performance-proxy.pid"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --insecure https://127.0.0.1:3443/ > /dev/null; then
              echo 'PERF_TARGET_URL=https://127.0.0.1:3443' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat output/performance/stack/https-proxy.log
          exit 1

      - name: Run browser performance measurements
        id: browser
        continue-on-error: true
        run: |
          PLAYWRIGHT_BASE_URL="$PERF_TARGET_URL" \
          NEXT_PUBLIC_API_BASE_URL="$PERF_API_URL" \
          PERF_DEVICE_ID="perf-playwright-${GITHUB_RUN_ID}" \
          PERF_ENFORCE_BUDGETS=1 \
          pnpm exec playwright test -c playwright.performance.config.ts

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run critical API load test
        id: k6
        continue-on-error: true
        env:
          OET_PERF_LEARNER_EMAIL: ${{ secrets.OET_PERF_LEARNER_EMAIL }}
          OET_PERF_LEARNER_PASSWORD: ${{ secrets.OET_PERF_LEARNER_PASSWORD }}
          OET_PERF_ADMIN_ACCESS_TOKEN: ${{ secrets.OET_PERF_ADMIN_ACCESS_TOKEN }}
        run: |
          learner_email="$OET_PERF_LEARNER_EMAIL"
          learner_password="$OET_PERF_LEARNER_PASSWORD"
          if [ "$PERF_MODE" = 'ephemeral' ]; then
            learner_email='learner@oet-prep.dev'
            learner_password='Password123!'
          fi
          mkdir -p output/performance/k6
          K6_TARGET_URL="$PERF_API_URL" \
          OET_TEST_LEARNER_EMAIL="$learner_email" \
          OET_TEST_LEARNER_PASSWORD="$learner_password" \
          OET_TEST_ADMIN_ACCESS_TOKEN="$OET_PERF_ADMIN_ACCESS_TOKEN" \
          OET_TEST_DEVICE_ID="perf-playwright-${GITHUB_RUN_ID}" \
          k6 run --summary-export output/performance/k6/critical-paths.json tests/load/critical-paths.k6.js

      - name: Capture isolated stack logs
        if: always() && env.PERF_MODE == 'ephemeral'
        run: |
          mkdir -p output/performance/stack
          docker compose -f docker-compose.desktop.yml logs --no-color > output/performance/stack/docker-compose.log

      - name: Shut down isolated stack
        if: always() && env.PERF_MODE == 'ephemeral'
        run: |
          if [ -f "$RUNNER_TEMP/oet-performance-proxy.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/oet-performance-proxy.pid")" 2>/dev/null || true
          fi
          docker compose -f docker-compose.desktop.yml down --remove-orphans

      - name: Summarize browser reports
        id: summary
        if: always()
        env:
          PERF_ENFORCE_BUDGETS: '1'
        run: |
          pnpm exec node scripts/perf/summarize-browser-reports.mjs output/performance/browser | tee output/performance/browser-summary.md
          cat output/performance/browser-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.run_id }}
          path: output/performance
          if-no-files-found: error
          retention-days: 14

      - name: Fail if a performance gate failed
        if: always()
        env:
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          K6_RESULT: ${{ steps.k6.outcome }}
          SUMMARY_RESULT: ${{ steps.summary.outcome }}
        run: |
          if [ "$BROWSER_RESULT" != "success" ] || [ "$K6_RESULT" != "success" ] || [ "$SUMMARY_RESULT" != "success" ]; then
            echo "Performance gate failed: browser=$BROWSER_RESULT k6=$K6_RESULT summary=$SUMMARY_RESULT"
            exit 1
          fi
