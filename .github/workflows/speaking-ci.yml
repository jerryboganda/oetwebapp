name: Speaking Module CI

on:
  pull_request:
    paths:
      - 'app/speaking/**'
      - 'app/expert/speaking/**'
      - 'app/expert/private-speaking/**'
      - 'app/expert/speaking-room/**'
      - 'app/admin/content/speaking/**'
      - 'app/admin/private-speaking/**'
      - 'app/admin/analytics/speaking/**'
      - 'app/admin/analytics/mocks/**'
      - 'app/mocks/bookings/**'
      - 'app/mocks/speaking/**'
      - 'app/mocks/speaking-room/**'
      - 'app/private-speaking/**'
      - 'app/admin/free-tier/**'
      - 'app/writing/practice/library/**'
      - 'components/domain/speaking/**'
      - 'components/domain/speaking/LiveRoomRealtime.tsx'
      - 'hooks/useSpeakingRealtimeVoice.ts'
      - 'lib/api/speaking-*.ts'
      - 'lib/api/mock-bookings.ts'
      - 'lib/api/private-speaking.ts'
      - 'lib/writing/api.ts'
      - 'lib/api/interlocutor-*.ts'
      - 'lib/analytics/speaking-events.ts'
      - 'backend/src/OetLearner.Api/Domain/Speaking*.cs'
      - 'backend/src/OetLearner.Api/Domain/RolePlay*.cs'
      - 'backend/src/OetLearner.Api/Domain/Interlocutor*.cs'
      - 'backend/src/OetLearner.Api/Domain/FreeTier*.cs'
      - 'backend/src/OetLearner.Api/Domain/RuntimeSettingsRow.cs'
      - 'backend/src/OetLearner.Api/Configuration/FeatureFlagOptions.cs'
      - 'backend/src/OetLearner.Api/Configuration/LiveKitOptions.cs'
      - 'backend/src/OetLearner.Api/Configuration/LiveVoiceOptions.cs'
      - 'backend/src/OetLearner.Api/Contracts/LiveVoiceContracts.cs'
      - 'backend/src/OetLearner.Api/Data/Migrations/**'
      - 'backend/src/OetLearner.Api/Data/LearnerDbContext.cs'
      - 'backend/src/OetLearner.Api/Services/Speaking/**'
      - 'backend/src/OetLearner.Api/Endpoints/*Speaking*.cs'
      - 'backend/src/OetLearner.Api/Endpoints/LiveVoiceEndpoints.cs'
      - 'backend/src/OetLearner.Api/Endpoints/LiveKitWebhookEndpoint.cs'
      - 'backend/src/OetLearner.Api/Endpoints/PrivateSpeakingEndpoints.cs'
      - 'backend/src/OetLearner.Api/Endpoints/AdminEndpoints.cs'
      - 'backend/src/OetLearner.Api/Endpoints/LearnerEndpoints.cs'
      - 'backend/src/OetLearner.Api/Endpoints/WritingScenarioEndpoints.cs'
      - 'backend/src/OetLearner.Api/Services/FreeTierContentResolver.cs'
      - 'backend/src/OetLearner.Api/Services/AdminService.FreeTierContent.cs'
      - 'backend/src/OetLearner.Api/Services/AdminService*.cs'
      - 'backend/src/OetLearner.Api/Services/LearnerService.cs'
      - 'backend/src/OetLearner.Api/Services/PrivateSpeakingService.cs'
      - 'backend/src/OetLearner.Api/Services/MockBooking*.cs'
      - 'backend/src/OetLearner.Api/Services/LiveClasses/LiveClassService.cs'
      - 'backend/src/OetLearner.Api/Services/MockService.cs'
      - 'backend/src/OetLearner.Api/Services/MockBookingRecordingService.cs'
      - 'backend/src/OetLearner.Api/Services/Content/S3CompatibleFileStorage.cs'
      - 'backend/src/OetLearner.Api/Services/StudyPlan/ContentPicker.cs'
      - 'backend/src/OetLearner.Api/Program.cs'
      - 'backend/src/OetLearner.Api/appsettings*.json'
      - 'backend/src/OetLearner.Api/Endpoints/Tutor*.cs'
      - 'backend/src/OetLearner.Api/Endpoints/AdminSpeaking*.cs'
      - 'backend/src/OetLearner.Api/Hubs/**'
      - '.github/workflows/speaking-ci.yml'
      - '.env.production.example'
      - 'docs/env/speaking.md'
      - 'scripts/deploy/validate-production-env.sh'
  push:
    branches: [main]

concurrency:
  group: speaking-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ConnectionStrings__OetLearner: Host=localhost;Database=oet_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oet-stack
        with:
          with-postgres: "true"
      - name: Restore + build
        run: dotnet build backend/OetLearner.sln --configuration Release --nologo
      - name: Speaking-tagged tests
        run: dotnet test backend/OetLearner.sln --configuration Release --no-build --filter "FullyQualifiedName~Speaking" --logger "trx;LogFileName=speaking.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speaking-test-results
          path: '**/TestResults/*.trx'

  frontend:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: ./.github/actions/setup-oet-stack
      - name: Lint
        run: pnpm run lint
      - name: Vitest
        run: pnpm test -- --reporter=verbose
      - name: Type-check
        run: pnpm exec tsc --noEmit --pretty false
      - name: Build
        run: pnpm run build

  migrations-check:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oet-stack
      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Pending model changes?
        run: |
          dotnet restore backend/src/OetLearner.Api/OetLearner.Api.csproj --nologo
          dotnet build backend/src/OetLearner.Api/OetLearner.Api.csproj --configuration Release --nologo
          cd backend/src/OetLearner.Api
          set +e
          "$HOME/.dotnet/tools/dotnet-ef" migrations has-pending-model-changes --configuration Release --no-build > /tmp/ef.out 2>&1
          ef_status=$?
          set -e
          cat /tmp/ef.out
          if grep -qi "no changes" /tmp/ef.out || [ "$ef_status" -eq 0 ]; then
            echo "OK: no pending model changes."
          else
            echo "FAIL: pending model changes detected or EF check failed - create a migration or fix the EF command." >&2
            # has-pending-model-changes never says WHAT drifted. Scaffold a
            # throwaway migration on this ephemeral runner and print its Up()
            # so the log names the exact entity/property.
            "$HOME/.dotnet/tools/dotnet-ef" migrations add CiDriftProbe --configuration Release --no-build > /dev/null 2>&1 \
              && find . -name '*_CiDriftProbe.cs' ! -name '*.Designer.cs' -exec cat {} + || true
            exit 1
          fi

  secrets-scan:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        continue-on-error: true
