      - 'scripts/deploy/validate-production-env.sh'

concurrency:
  group: speaking-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations-check:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oet-stack
      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Pending model changes?
        run: |
          dotnet restore backend/src/OetLearner.Api/OetLearner.Api.csproj --nologo
          dotnet build backend/src/OetLearner.Api/OetLearner.Api.csproj --configuration Release --nologo
          cd backend/src/OetLearner.Api
          set +e
          "$HOME/.dotnet/tools/dotnet-ef" migrations has-pending-model-changes --configuration Release --no-build > /tmp/ef.out 2>&1
          ef_status=$?
          set -e
          cat /tmp/ef.out
          if grep -qi "no changes" /tmp/ef.out || [ "$ef_status" -eq 0 ]; then
            echo "OK: no pending model changes."
          else
            echo "FAIL: pending model changes detected or EF check failed - create a migration or fix the EF command." >&2
            # has-pending-model-changes never says WHAT drifted. Scaffold a
            # throwaway migration on this ephemeral runner and print its Up()
            # so the log names the exact entity/property.
            "$HOME/.dotnet/tools/dotnet-ef" migrations add CiDriftProbe --configuration Release --no-build > /dev/null 2>&1 \
              && find . -name '*_CiDriftProbe.cs' ! -name '*.Designer.cs' -exec cat {} + || true
            exit 1
          fi

  secrets-scan:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        continue-on-error: true
