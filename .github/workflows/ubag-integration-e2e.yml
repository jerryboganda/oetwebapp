name: UBAG integration end-to-end

# Verifies the OET <-> UBAG bridge end to end.
#
# COMPUTE ISOLATION: every build, install, test and probe executes on the GitHub
# Actions runner. The production VPS performs NO computation: it answers one
# read-only docker inspect, one read-only file read, and forwards bytes for an
# SSH local port-forward. No image is pulled, no script is executed and no test
# runs on the VPS.
#
# Coverage:
#   1. OET-side contract tests: UBAG provider seeder, registry-backed provider
#      resolution, provider connection tester, assistant model catalog, and the
#      admin AI-provider board components.
#   2. Live facade contract + a per-provider sweep across every browser provider,
#      reached through an SSH local port-forward to the gateway on the OET
#      internal network (the same path oet-api uses).
#
# Uses pre-existing repo secrets: PROD_SSH_KEY (and VPS_* for reference).
on:
  push:
    paths:
      - ".github/workflows/ubag-integration-e2e.yml"
      - "scripts/deploy/ubag-e2e-probe.py"
      - "app/admin/ai-providers/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Probe mode: core (facade only), providers (targets only), all"
        required: false
        default: "all"
        type: choice
        options: [all, core, providers]
      targets:
        description: "Comma-separated browser targets to probe"
        required: false
        default: "deepseek_web,chatgpt_web,claude_web,gemini_web,mistral_lechat,perplexity_web,duckai_web"
      probe_budget_s:
        description: "Total seconds to let the single-concurrency provider queue drain"
        required: false
        default: "1800"

permissions:
  contents: read

concurrency:
  group: ubag-integration-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-tests:
    name: OET-side UBAG contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Backend tests covering the UBAG bridge surface
        run: >
          dotnet test backend/tests/OetLearner.Api.Tests/OetLearner.Api.Tests.csproj
          -p:RunAnalyzers=false
          --filter "FullyQualifiedName~UbagProviderSeederTests|FullyQualifiedName~RegistryBackedProviderTests|FullyQualifiedName~AiProviderConnectionTesterTests|FullyQualifiedName~AssistantModelCatalogTests"
          --verbosity minimal

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Frontend tests covering the UBAG admin board
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            app/admin/ai-providers/ubag/page.test.tsx \
            app/admin/ai-providers/page.test.tsx

  # Deliberately independent of contract-tests: a unit-test failure must not
  # suppress the live integration evidence.
  live-e2e:
    name: Live facade and browser target probes
    runs-on: ubuntu-latest
    # Generous: the live worker is single-concurrency, and a provider awaiting
    # sign-in can take ~5-8 minutes to surface that state.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe every provider from this runner over an SSH port-forward
        env:
          # Dedicated CI deploy key, same one the production rollout uses.
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          VPS_HOST: "185.252.233.186"
          VPS_USER: "root"
          VPS_PORT: "22"
          PROBE_MODE: ${{ inputs.mode || 'all' }}
          PROBE_TARGETS: ${{ inputs.targets || 'deepseek_web,chatgpt_web,claude_web,gemini_web,mistral_lechat,perplexity_web,duckai_web' }}
          PROBE_BUDGET: ${{ inputs.probe_budget_s || '1800' }}
          LOCAL_PORT: "18080"
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh_opts=(
            -i ~/.ssh/deploy_key -p "$PORT"
            -o IdentitiesOnly=yes -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )

          # --- read-only lookup: the gateway's address on the OET network -----
          # `docker inspect` is a state query; nothing is executed on the host.
          read -r -d '' REMOTE_INSPECT <<'EOS' || true
          docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}={{$v.IPAddress}} {{end}}' ubag-vps-gateway-1
          EOS
          NET_LINE="$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "$REMOTE_INSPECT" | tr ' ' '\n' | grep '^oetwebsite_internal=' || true)"
          GW_IP="${NET_LINE#oetwebsite_internal=}"
          if [ -z "$GW_IP" ]; then
            echo "::error::ubag-vps-gateway-1 is not attached to oetwebsite_internal (got: $NET_LINE)"
            exit 1
          fi
          echo "[PASS   ] ubag-vps-gateway-1 is attached to oetwebsite_internal (${GW_IP})"

          # --- read-only lookup: the tenant PAT ------------------------------
          read -r -d '' REMOTE_PAT <<'EOS' || true
          grep -m1 '^UBAG_OET_PAT=' /opt/oetwebapp/.env.production
          EOS
          PAT="$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "$REMOTE_PAT" \
            | sed -e 's/^UBAG_OET_PAT=//' -e 's/\r$//' -e 's/^"//' -e 's/"$//')"
          if [ -z "$PAT" ]; then
            echo "::error::UBAG_OET_PAT is not set in /opt/oetwebapp/.env.production"
            exit 1
          fi
          echo "::add-mask::$PAT"

          # --- pure TCP transport; the VPS computes nothing ------------------
          ssh -f -N -o ExitOnForwardFailure=yes "${ssh_opts[@]}" \
            -L "127.0.0.1:${LOCAL_PORT}:${GW_IP}:8080" "$VPS_USER@$VPS_HOST"

          cleanup() { pkill -f "ssh .*-L 127.0.0.1:${LOCAL_PORT}:" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          # --- all computation happens here, on the runner -------------------
          set +e
          UBAG_BASE="http://127.0.0.1:${LOCAL_PORT}" UBAG_PAT="$PAT" \
            python3 scripts/deploy/ubag-e2e-probe.py "$PROBE_MODE" "$PROBE_TARGETS" "$PROBE_BUDGET" \
            2>&1 | tee probe.log
          rc="${PIPESTATUS[0]}"
          set -e

          {
            echo "### Live UBAG probes (executed on the runner)"
            echo '```'
            sed -n '/=== UBAG PROBE SUMMARY ===/,/=== END SUMMARY ===/p' probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -eq 1 ]; then
            echo "::error::Core facade contract breached, or a provider reported a genuine defect."
            exit 1
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::error::Core contract held but every provider probe failed."
            exit 1
          fi
          if grep -q '^OPERATOR-ACTION-REQUIRED' probe.log; then
            echo "::warning::One or more providers need an operator sign-in (dashboard Browser Sessions widget). This is not a code defect."
          fi
          echo "Core facade contract held."
