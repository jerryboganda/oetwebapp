name: Writing Rev8 CI

# Validates the Writing "Rule Enforcement & Model Answer Validation Addendum,
# Revision 8" branch on GitHub Actions (the only authorized compute
# environment — see AGENTS.md) and regenerates the canonical Writing
# rulebooks from docs/canonical-rules/OET_AI_Rules_Master.jsonl.
#
# The regenerated rulebooks are uploaded as an artifact and are ALSO what the
# backend and frontend tests run against (the API embeds rulebooks/**/*.json at
# build time; lib/rulebook imports them statically), so a green run describes
# the tree as it will be once the regenerated files are committed.
on:
  push:
    branches:
      - 'ci/writing-rev8/**'
      - 'fix/writing-rev8-rule-enforcement'
  workflow_dispatch:
    inputs:
      jev_only:
        description: "Run only the live Jev repair judgment"
        required: false
        default: false
        type: boolean
      dotnet_filter:
        description: "dotnet test --filter expression (blank = Writing/Rulebook default scope)"
        required: false
        default: ""
        type: string
      vitest_paths:
        description: "Space-separated vitest path filters (blank = Writing/rulebook default scope)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: writing-rev8-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jev:
    if: inputs.jev_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix "$RUNNER_TEMP/jev" ai@7.0.107
      - name: Judge proposed Writing repair
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        working-directory: ${{ runner.temp }}/jev
        run: |
          node --input-type=module <<'NODE'
          import { experimental_evaluate as evaluate } from 'ai';
          const state = {
            evidence: "Owner now authorizes deployment and stored-answer revalidation. Tested task branch is 32 ahead/49 behind main. Deploying it would remove over 13000 lines of newer Writing audit rules/tests and Jev integrations. Main already excludes possessive today and has a minor-name detector that avoids confusing parents with children; preserve these newer rules. Main revalidation ignores lastDraft, filters out null ModelAnswerText, and does not refresh deterministic-only successful runs when a semantic validator is registered. Task-branch recovery behavior and tests already passed CI.",
            proposedRepair: "Integrate only stored-draft recovery into current main in an isolated checkout. Preserve main's TodayDate check, senior audits, candidate rules, and newer integrations. Revalidate latest saved draft or existing answer; retain rejected status and never enable visibility automatically. includeSemantic=false is explicit owner policy; refresh versions for passing requested checks. Add tests for latest draft, held recovery, rejected protection, and visibility; run Actions on integrated code, deploy with health gates, dry-run all existing answers before applying revalidation. No invented scenarios or forced publication.",
            limits: "Do not blindly merge or deploy the old task branch. If integration or CI exposes a mismatch, repair it before deployment. A passing deterministic report is not a claim of semantic review or automatic approval."
          };
          const { answers } = await evaluate({
            model: 'typesafe-ai/jev', state,
            questions: { repair: { type: 'choice', instructions: 'Which next action is supported by the evidence and proposed repair?', criteria: {
              repair_detector: 'Proceed with scoped revalidation recovery on current main, preserve newer detectors, validate and deploy with health gates.',
              change_letters: 'Deploy the older task branch as-is, replacing newer main code.',
              investigate_more: 'Evidence is insufficient or the proposed repair is unsafe; pause for more investigation.'
            } } }, maxRetries: 1, abortSignal: AbortSignal.timeout(30000)
          });
          const answer = answers.repair;
          const options = ['repair_detector', 'change_letters', 'investigate_more'];
          if (!answer || answer.type !== 'choice' || !options.includes(answer.choice)) throw new Error('Invalid choice answer');
          const probabilities = options.map(option => answer.probabilities?.[option]);
          if (probabilities.some(value => !Number.isFinite(value) || value < 0 || value > 1)) throw new Error('Invalid probabilities');
          if (Math.abs(probabilities.reduce((sum, value) => sum + value, 0) - 1) > 0.02) throw new Error('Invalid distribution');
          console.log(JSON.stringify(answer));
          const selected = answer.probabilities[answer.choice];
          const runnerUp = Math.max(...options.filter(option => option !== answer.choice).map(option => answer.probabilities[option]));
          if (answer.choice !== 'repair_detector' || selected < 0.7 || selected - runnerUp < 0.3) throw new Error('Repair judgment paused');
          NODE

  rulebooks:
    if: inputs.jev_only != true
    name: Canonical Writing rulebooks (build + --check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate canonical Writing rulebooks
        run: node scripts/rulebooks/build-canonical-writing-rulebooks.mjs
      - name: Verify regenerated output is stable (--check)
        run: node scripts/rulebooks/build-canonical-writing-rulebooks.mjs --check
      # Informational only: the regenerated files are expected to differ from
      # the committed ones until they are committed.
      - name: Diff vs committed rulebooks
        run: git diff --stat -- rulebooks/writing
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-writing-rulebooks
          path: rulebooks/writing/*/rulebook.v1.json
          if-no-files-found: error
          retention-days: 7

  backend:
    if: inputs.jev_only != true
    name: Backend Writing/Rulebook tests (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No Postgres service: [PostgreSqlFact] tests self-skip without
    # OET_TEST_POSTGRES_CONNECTION.
    env:
      DOTNET_FILTER: ${{ inputs.dotnet_filter || 'FullyQualifiedName~OetLearner.Api.Tests.WritingRuleEngineTests|FullyQualifiedName~OetLearner.Api.Tests.WritingRulebookCoverageValidatorTests|FullyQualifiedName~OetLearner.Api.Tests.RulebookLoaderTests|FullyQualifiedName~OetLearner.Api.Tests.AiGatewayAndPromptTests|FullyQualifiedName~OetLearner.Api.Tests.Rulebook.|FullyQualifiedName~OetLearner.Api.Tests.Writing.|FullyQualifiedName~OetLearner.Api.Tests.WritingCoachServiceTests|FullyQualifiedName~OetLearner.Api.Tests.WritingEntitlementServiceTests|FullyQualifiedName~OetLearner.Api.Tests.WritingLearnerVisibilityTests' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore test project
        run: dotnet restore backend/tests/OetLearner.Api.Tests/OetLearner.Api.Tests.csproj
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Must run before the build below: the API embeds rulebooks/**/*.json.
      - name: Regenerate canonical Writing rulebooks
        run: node scripts/rulebooks/build-canonical-writing-rulebooks.mjs
      - name: Test
        run: |
          set -euo pipefail
          dotnet test backend/tests/OetLearner.Api.Tests/OetLearner.Api.Tests.csproj \
            -c Release \
            --no-restore \
            --nologo \
            -p:RunAnalyzers=false \
            --filter "$DOTNET_FILTER" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=results.trx" \
            --results-directory test-results \
            2>&1 | tee test.log
          # A filter that matches nothing exits 0 — refuse that as a pass.
          if ! grep -Eiq 'total( tests)?: *[1-9]' test.log; then
            echo "::error::The test filter matched zero tests: $DOTNET_FILTER"
            exit 1
          fi
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writing-rev8-backend-test-results
          path: |
            test-results/
            test.log
          if-no-files-found: ignore
          retention-days: 7

  backend-build:
    if: inputs.jev_only != true
    name: Backend compile gate (whole solution)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (API + all test code)
        run: dotnet build backend/OetLearner.sln -c Release -p:RunAnalyzers=false --nologo

  frontend:
    if: inputs.jev_only != true
    name: Frontend (tsc + scoped vitest + changed-file lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITEST_PATHS: ${{ inputs.vitest_paths || 'lib/rulebook app/writing components/domain/writing components/domain/InsufficientCreditsModal' }}
    steps:
      # Full commit graph (blobless, so still cheap) for the merge-base diff
      # that scopes the lint step to files this branch changed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lib/rulebook imports rulebooks/writing/*/rulebook.v1.json statically;
      # type-check and test against the regenerated copies, like the backend.
      - name: Regenerate canonical Writing rulebooks
        run: node scripts/rulebooks/build-canonical-writing-rulebooks.mjs
      - run: pnpm exec tsc --noEmit
      # Vitest ORs its path filters and only fails when none match, so a filter
      # with no test file yet (e.g. InsufficientCreditsModal) is harmless.
      - name: Vitest (scoped)
        run: |
          set -euo pipefail
          read -ra paths <<< "$VITEST_PATHS"
          pnpm exec vitest run "${paths[@]}"
      # Lints only frontend files this branch changed vs main, so pre-existing
      # lint debt in untouched files never fails this workflow.
      - name: ESLint (changed frontend files)
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          mapfile -t files < <(git diff --name-only --no-renames --diff-filter=d "$base" HEAD -- app components contexts hooks lib | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed frontend files to lint."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          pnpm exec eslint "${files[@]}"
