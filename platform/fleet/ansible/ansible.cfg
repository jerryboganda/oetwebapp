# Ansible configuration for the OET fleet manager. The manager container sets ANSIBLE_CONFIG to this file
# and runs ansible-playbook with HOME, ANSIBLE_HOME and temp directories on tmpfs (see Provisioning in the manager).
# Only ansible.builtin modules are used: no Galaxy collections, no unpinned supply chain.
[defaults]
inventory = inventory/target.yml
host_key_checking = True
retry_files_enabled = False
gathering = explicit
deprecation_warnings = False
nocolor = True
timeout = 30
forks = 2
interpreter_python = auto_silent
display_skipped_hosts = False

[ssh_connection]
pipelining = True
retries = 1
