name: Visual QA

# Runs tests/e2e/shared/visual-qa.spec.ts (@visual) against the production-mode
# Docker stack: no horizontal overflow at 360/768/1280/1920 on representative
# routes per role, with full-page screenshots uploaded for review. Also runs
# tests/e2e/shared/route-transition.spec.ts (staff client-navigation entrance),
# tests/e2e/shared/command-palette.spec.ts (Ctrl/⌘K palette per role) and
# tests/e2e/shared/learner-layout-crawl.spec.ts (every learner route: clipped,
# spilling or off-screen text; report-only except its ENFORCED_ROUTES, findings
# in the job summary).
# Separate from QA Smoke so layout checks never slow or redden the smoke gate.
# One worker: each seeded role allows a single active session, so parallel tests
# of one role revoke each other's session and land on /sign-in.
on:
  workflow_dispatch:
    inputs:
      writing_journeys:
        description: Run the six Writing V2 learner journeys instead of the visual sweep
        type: boolean
        default: false
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'tests/e2e/shared/visual-qa.spec.ts'
      - 'tests/e2e/shared/route-transition.spec.ts'
      - 'tests/e2e/shared/command-palette.spec.ts'
      - 'tests/e2e/shared/learner-layout-crawl.spec.ts'

concurrency:
  group: visual-qa-${{ github.ref }}${{ inputs.writing_journeys && '-writing' || '' }}
  cancel-in-progress: true

jobs:
  visual-qa:
    name: Visual QA (chromium, 4 roles × 4 widths)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build local stack
        run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.desktop.yml up -d --build; then
              exit 0
            fi
            docker compose -f docker-compose.desktop.yml down -v || true
            sleep $((attempt * 15))
          done
          docker compose -f docker-compose.desktop.yml up -d --build

      - name: Verify stack readiness
        run: node ./scripts/qa/assert-local-stack.mjs

      - name: Run visual sweep
        if: ${{ !inputs.writing_journeys }}
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: >
          pnpm exec playwright test tests/e2e/shared/visual-qa.spec.ts
          tests/e2e/shared/route-transition.spec.ts
          tests/e2e/shared/command-palette.spec.ts
          tests/e2e/shared/learner-layout-crawl.spec.ts
          --project=chromium-unauth --project=chromium-learner
          --project=chromium-expert --project=chromium-admin
          --workers=1

      - name: Run Writing V2 journeys
        if: ${{ inputs.writing_journeys }}
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: >
          pnpm exec playwright test
          tests/e2e/writing-v2/onboarding.spec.ts
          tests/e2e/writing-v2/diagnostic.spec.ts
          tests/e2e/writing-v2/canon-library.spec.ts
          tests/e2e/writing-v2/drills.spec.ts
          tests/e2e/writing-v2/stats.spec.ts
          tests/e2e/writing-v2/mocks.spec.ts
          --project=chromium-learner --workers=1 --retries=0

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: |
            output/playwright/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Shut down stack
        if: always()
        run: docker compose -f docker-compose.desktop.yml down -v
