name: Deploy production

# The run name carries the deployed SHA so watchers can find a run for a commit
# even though a `workflow_run`-triggered run lives on the default branch
# (owner console src/ship.ts matches on it, then falls back to head_sha).
run-name: Deploy production ${{ inputs.sha || github.event.workflow_run.head_sha }}

# Rollout half of the former "Build & Deploy (web + API)". Starts when a
# "Build images" run on main succeeds, or when dispatched with an existing SHA
# (that is the one-click rollback path: the images are already in GHCR).
#
# Several agents may build in parallel; PRODUCTION ROLLOUTS SERIALIZE through
# the `production-deploy` concurrency group, because two router flips at once
# would fight over the blue/green slots. The VPS never builds: it pulls the
# pre-built images and blue/green-redeploys them health-gated - a broken commit
# fails the gate and is NOT promoted, so prod stays up.
#
# SSH uses secrets.PROD_SSH_KEY (environment `production`). The box is
# root@185.252.233.186:22, /opt/oetwebapp; only the "Prune stale OET images"
# step still reads secrets VPS_HOST / VPS_USER / VPS_PORT.

on:
  workflow_run:
    workflows: ['Build images']
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full commit SHA already built and pushed to GHCR (rollback path)'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the build to deploy
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && !startsWith(github.event.workflow_run.display_title, 'Benchmark build ')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      build_run_id: ${{ steps.resolve.outputs.build_run_id }}
      deployable: ${{ steps.resolve.outputs.deployable }}
      api_changed: ${{ steps.resolve.outputs.api_changed }}
      api_source_sha: ${{ steps.resolve.outputs.api_source_sha }}
      api_source_run: ${{ steps.resolve.outputs.api_source_run }}
      sql_checksum: ${{ steps.resolve.outputs.sql_checksum }}
      web_image: ${{ steps.resolve.outputs.web_image }}
      api_image: ${{ steps.resolve.outputs.api_image }}
      backup_image: ${{ steps.resolve.outputs.backup_image }}
      gateway_image: ${{ steps.resolve.outputs.gateway_image }}
      legacy: ${{ steps.resolve.outputs.legacy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: resolve
        name: Verify immutable release and applied-API provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/deploy/release-manifest.mjs resolve
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.legacy != 'true'
        with:
          name: release-candidate
          path: output/release.json
          if-no-files-found: error
          retention-days: 1

  apply-migrations:
    name: Apply migration SQL (if the API changed)
    needs: [resolve]
    if: ${{ needs.resolve.outputs.deployable == 'true' && needs.resolve.outputs.api_changed == 'true' }}
    environment: production
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: api-release-${{ needs.resolve.outputs.api_source_sha }}
          run-id: ${{ needs.resolve.outputs.api_source_run }}
          github-token: ${{ github.token }}
          path: output/api-release
      - name: Verify the successful source build and SQL checksum
        env:
          GH_TOKEN: ${{ github.token }}
          API_SOURCE_SHA: ${{ needs.resolve.outputs.api_source_sha }}
          API_SOURCE_RUN: ${{ needs.resolve.outputs.api_source_run }}
          SQL_CHECKSUM: ${{ needs.resolve.outputs.sql_checksum }}
        run: node scripts/deploy/release-manifest.mjs verify-api

      - name: Apply migration SQL through the production PostgreSQL container
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          VPS_HOST: "185.252.233.186"
          VPS_USER: "root"
          VPS_PORT: "22"
          APP_DIR: "/opt/oetwebapp"
        run: |
          set -euo pipefail
          test -s output/api-release/migrations.sql
          PORT="${VPS_PORT:-22}"
          REMOTE_WRAPPER="/tmp/oet-apply-migrations-${GITHUB_RUN_ID}.sh"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh_opts=(
            -i ~/.ssh/deploy_key -p "$PORT"
            -o IdentitiesOnly=yes -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )
          cleanup() {
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "rm -f '$REMOTE_WRAPPER'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "umask 077; cat > '$REMOTE_WRAPPER'; chmod 700 '$REMOTE_WRAPPER'" \
            < scripts/deploy/apply-migrations-from-ci.sh
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "set -e; VPS_APP_DIR='$APP_DIR' bash '$REMOTE_WRAPPER'" \
            < output/api-release/migrations.sql

  deploy:
    name: Roll out to the VPS
    needs: [resolve, apply-migrations]
    if: ${{ always() && needs.resolve.outputs.deployable == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    environment: production
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      BUILD_RUN_ID: ${{ needs.resolve.outputs.build_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v4
        if: needs.resolve.outputs.legacy != 'true'
        with:
          name: release-candidate
          path: output
      - name: Load the target release configuration using the maintained driver
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          for file in docker-compose.production.yml scripts/deploy/nginx/web-bluegreen.conf.template scripts/deploy/nginx/api-bluegreen.conf.template; do
            gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$SHA" --jq '.content' | base64 --decode > "$file"
            test -s "$file"
          done
      - id: preflight
        name: Immediate successful-descendant check
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/deploy/release-manifest.mjs superseded
      - name: Deploy to VPS over SSH (pull + blue/green redeploy)
        id: rollout
        if: steps.preflight.outputs.superseded != 'true'
        env:
          # Dedicated CI deploy key (authorized on the real prod box's root).
          # Cutover 2026-06-05 moved production to MAIN; app/api DNS now resolve
          # to 185.252.233.186. The old 68.183.32.122 box was decommissioned, so
          # host/user/path are hardcoded to current prod (185.252.233.186).
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          VPS_HOST: "185.252.233.186"
          VPS_USER: "root"
          VPS_PORT: "22"
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_IMAGE: ${{ needs.resolve.outputs.web_image }}
          API_IMAGE: ${{ needs.resolve.outputs.api_image }}
          DB_BACKUP_IMAGE: ${{ needs.resolve.outputs.backup_image }}
          AGENT_GATEWAY_IMAGE: ${{ needs.resolve.outputs.gateway_image }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          APP_DIR="/opt/oetwebapp"
          REMOTE_DIR="/tmp/oet-image-rollout-${GITHUB_RUN_ID}"
          REMOTE_SCRIPT="$REMOTE_DIR/auto-deploy-ghcr.sh"
          REMOTE_COMPOSE="$REMOTE_DIR/docker-compose.production.yml"
          REMOTE_VALIDATE="$REMOTE_DIR/validate-production-env.sh"
          REMOTE_NGINX="$REMOTE_DIR/web-bluegreen.conf.template"
          REMOTE_NGINX_API="$REMOTE_DIR/api-bluegreen.conf.template"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh_opts=(
            -i ~/.ssh/deploy_key -p "$PORT"
            -o IdentitiesOnly=yes -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )
          cleanup() {
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
              "rm -f '$REMOTE_SCRIPT' '$REMOTE_COMPOSE' '$REMOTE_VALIDATE' '$REMOTE_NGINX' '$REMOTE_NGINX_API' \
               '$REMOTE_DIR/docker-auth-prepare/config.json' '$REMOTE_DIR/docker-auth-promote/config.json'; \
               rmdir '$REMOTE_DIR/docker-auth-prepare' '$REMOTE_DIR/docker-auth-promote' 2>/dev/null || true; \
               rmdir '$REMOTE_DIR' 2>/dev/null || true" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # One tar stream instead of five sequential ssh round-trips; the file
          # modes are re-applied on the remote side (owner directive 2026-10-03).
          STAGE="$RUNNER_TEMP/rollout"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp scripts/deploy/auto-deploy-ghcr.sh "$STAGE/auto-deploy-ghcr.sh"
          cp docker-compose.production.yml "$STAGE/docker-compose.production.yml"
          cp scripts/deploy/validate-production-env.sh "$STAGE/validate-production-env.sh"
          cp scripts/deploy/nginx/web-bluegreen.conf.template "$STAGE/web-bluegreen.conf.template"
          cp scripts/deploy/nginx/api-bluegreen.conf.template "$STAGE/api-bluegreen.conf.template"
          tar -czf - -C "$STAGE" . | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "umask 077; mkdir -p '$REMOTE_DIR'; tar -xzf - -C '$REMOTE_DIR'; \
             chmod 700 '$REMOTE_SCRIPT' '$REMOTE_VALIDATE'; \
             chmod 600 '$REMOTE_COMPOSE'; \
             chmod 644 '$REMOTE_NGINX' '$REMOTE_NGINX_API'"
          deploy_phase() {
            local phase="$1"
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "set -e; umask 077; export DOCKER_CONFIG='$REMOTE_DIR/docker-auth-$phase'; mkdir -p \"\$DOCKER_CONFIG\"; \
             cleanup_registry() { status=\$?; trap - EXIT; docker logout ghcr.io >/dev/null 2>&1 || true; \
               if ! rm -f \"\$DOCKER_CONFIG/config.json\" || ! rmdir \"\$DOCKER_CONFIG\"; then \
                 echo 'Temporary registry authorization cleanup failed' >&2; [ \"\$status\" -ne 0 ] || status=1; \
               fi; exit \"\$status\"; }; trap cleanup_registry EXIT; \
             echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin; \
             WEB_IMAGE='$WEB_IMAGE' API_IMAGE='$API_IMAGE' DB_BACKUP_IMAGE='$DB_BACKUP_IMAGE' \
             AGENT_GATEWAY_IMAGE='$AGENT_GATEWAY_IMAGE' RELEASE_SHA='$SHA' DEPLOY_PHASE='$phase' \
             VPS_APP_DIR='$APP_DIR' VPS_COMPOSE_FILE='$REMOTE_COMPOSE' VPS_VALIDATE_ENV_SCRIPT='$REMOTE_VALIDATE' \
             NGINX_TEMPLATE_SRC='$REMOTE_NGINX' NGINX_API_TEMPLATE_SRC='$REMOTE_NGINX_API' \
               bash '$REMOTE_SCRIPT'"
          }
          deploy_phase prepare | tee "$RUNNER_TEMP/rollout-prepare.log"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            node scripts/deploy/release-manifest.mjs superseded
            if grep -q '^superseded=true$' "$GITHUB_OUTPUT"; then
              echo "promoted=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          deploy_phase promote | tee "$RUNNER_TEMP/rollout-promote.log"
          grep -q '^DEPLOY_LIVE ' "$RUNNER_TEMP/rollout-promote.log"
          mkdir -p output
          grep '^DEPLOY_LIVE ' "$RUNNER_TEMP/rollout-promote.log" > output/promotion-proof.txt
          echo "promoted=true" >> "$GITHUB_OUTPUT"
      - name: Record actual promotion
        uses: actions/upload-artifact@v4
        if: steps.rollout.outputs.promoted == 'true'
        with:
          name: promotion-proof
          path: output/promotion-proof.txt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: ${{ steps.rollout.outputs.promoted == 'true' && needs.resolve.outputs.legacy != 'true' }}
        with:
          name: production-release
          path: output/release.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-timing
          path: ${{ runner.temp }}/rollout-*.log
          if-no-files-found: warn
      # Every third rollout only: pruning walks the whole image store on a
      # shared host and is not needed after every push. The check lives in a
      # shell step because GitHub expressions have NO modulo operator (`%` makes
      # the whole workflow file invalid - it silently stops registering).
      - name: Decide whether to prune
        id: prune
        if: ${{ success() && steps.rollout.outputs.promoted == 'true' }}
        run: |
          if [ $((GITHUB_RUN_NUMBER % 3)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prune stale OET images on VPS
        if: ${{ success() && steps.prune.outputs.run == 'true' }}
        timeout-minutes: 1
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh_opts=(-i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' -- 24 < scripts/deploy/prune-stale-images.sh
      - name: Summary
        if: always()
        run: |
          echo "### Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- web: \`ghcr.io/${{ github.repository }}-web:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- api: \`ghcr.io/${{ github.repository }}-api:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- backup: \`ghcr.io/${{ github.repository }}-db-backup:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- agent-gateway: \`ghcr.io/${{ github.repository }}-agent-gateway:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- promoted: ${{ steps.rollout.outputs.promoted || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- cleanup: ${{ steps.prune.outputs.run == 'true' && 'bounded, non-blocking; inspect the cleanup step outcome' || 'not required' }}" >> "$GITHUB_STEP_SUMMARY"
