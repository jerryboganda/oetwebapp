name: Writing production QA (live)

# WAI-10 live QA of the Writing AI launch against PRODUCTION: disposable learners type the 36 verbatim
# handoff letters into the real Writing tasks, the P0-3 acceptance scenarios run, the result pages get
# geometry/overlap checks, and the QA-2 evidence table is published. Runbook: docs/qa/WRITING-PROD-QA.md.
#
# INERT by design: manual dispatch only (no schedule/push/PR trigger). suite=discover (the default) is
# strictly read-only. guard refuses to start during a deploy and validates the inputs; unit (vitest + the
# hermetic geometry detector spec) gates live; live runs ONE node process with one admin client; an always()
# safety net turns QA fault flags off and cleans up learners per the cleanup input. The repo is public while
# QA runs, so artifacts are public: evidence holds no letter/model-answer/case-note text, screenshots are
# clipped, the learner password is masked, emails are synthetic. Media 3 days, evidence 14 days.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: discover (read-only plan, default) | matrix (3 letters per enabled profession) | acceptance (P0-3 S1-S8, reading resume, L1+L2 fault) | ui (phone devices) | letters (6 realistic mixed major/minor letters, each on its own scenario; NOT part of all) | all
        type: choice
        options: [discover, matrix, acceptance, ui, letters, all]
        default: discover
      professions:
        description: Comma-separated handoff profession ids to include (blank = all twelve; disabled ones are reported NOT_ENABLED)
        type: string
        default: ''
      categories:
        description: Comma-separated script categories routine,urgent,discharge (blank = all three)
        type: string
        default: ''
      reading_window:
        description: real = wait out the live 5-minute reading window, seed = fast-forward the page clock (recorded on every row; acceptance is always real)
        type: choice
        options: [real, seed]
        default: real
      concurrency:
        description: Learner workers typing in parallel (grading itself is one letter at a time)
        type: choice
        options: ['1', '2', '3']
        default: '3'
      pace_seconds:
        description: Minimum seconds between two grading calls of one learner (the AiScoring limiter allows 2 per minute), at least 35
        type: string
        default: '35'
      fault_mode:
        description: flag = WAI-05 per-learner fault flags (real server failure), client = fake the failed status in the page only, none = skip fault scenarios
        type: choice
        options: [flag, client, none]
        default: flag
      verify_credits:
        description: Assert the credit rule on every letter (one 2-credit debit at task open, no second debit, no release)
        type: boolean
        default: true
      require_l2_disabled:
        description: Refuse to start unless the anthropic (L2, paid API) provider row is inactive
        type: boolean
        default: false
      preflight_repair:
        description: Reset an open or stale L2/L3 provider circuit before starting (audited admin action; the Max circuit and the quota marker are never repaired, they FAIL)
        type: boolean
        default: false
      browsers:
        description: ui suite devices, chromium = Pixel 7, chromium,webkit adds iPhone 14
        type: choice
        options: [chromium, 'chromium,webkit']
        default: chromium
      cleanup:
        description: on_success = purge the disposable learners only when every test passed, always, never
        type: choice
        options: [on_success, always, never]
        default: on_success

permissions:
  contents: read

concurrency:
  group: writing-prod-qa
  cancel-in-progress: false

# Free-text inputs reach the scripts through env only, never through the script text.
env:
  SUITE: ${{ inputs.suite }}
  PROFESSIONS: ${{ inputs.professions }}
  CATEGORIES: ${{ inputs.categories }}
  READING_WINDOW: ${{ inputs.reading_window }}
  CONCURRENCY: ${{ inputs.concurrency }}
  PACE_SECONDS: ${{ inputs.pace_seconds }}
  FAULT_MODE: ${{ inputs.fault_mode }}
  VERIFY_CREDITS: ${{ inputs.verify_credits }}
  REQUIRE_L2_DISABLED: ${{ inputs.require_l2_disabled }}
  PREFLIGHT_REPAIR: ${{ inputs.preflight_repair }}
  BROWSERS: ${{ inputs.browsers }}
  CLEANUP: ${{ inputs.cleanup }}
  QA_OUT_DIR: writing-prod-qa-out

jobs:
  guard:
    name: Guard (no deploy running, inputs valid)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Refuse to run while a production deploy is running or queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow production-deploy.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != 0 ]; then
            echo "::error::production-deploy.yml has $busy run(s) in progress or queued. Wait for production to settle, then dispatch again."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the inputs and the 36 handoff scripts
        run: node scripts/qa/writing-prod-qa/run.mjs check-inputs

  unit:
    name: Harness unit tests + hermetic detector spec
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest (pure verdicts, read-only discover client, workflow structure)
        run: pnpm exec vitest run scripts/qa/writing-prod-qa
      - name: Chromium for the detector spec
        run: pnpm exec playwright install --with-deps chromium
      - name: Geometry detectors fail on bad layouts (page.setContent, no app)
        run: pnpm exec playwright test tests/e2e/learner/writing-qa-detectors.spec.ts --project chromium-unauth --retries 0

  live:
    name: Live production QA (${{ inputs.suite }})
    needs: [guard, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage the harness next to an isolated Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/wqa"
          cp scripts/qa/writing-prod-qa/*.mjs scripts/qa/writing-prod-qa/scripts.json scripts/qa/writing-prod-qa/realistic-letters.json "$RUNNER_TEMP/wqa/"
      - name: Install isolated Playwright browsers
        if: ${{ inputs.suite != 'discover' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/wqa" --no-package-lock --no-save playwright@1.58.2
          engines=chromium
          case "$BROWSERS" in *webkit*) engines="chromium webkit" ;; esac
          "$RUNNER_TEMP/wqa/node_modules/.bin/playwright" install --with-deps $engines
      - name: Run the harness
        env:
          OET_ADMIN_EMAIL: ${{ secrets.OET_ADMIN_EMAIL }}
          OET_ADMIN_PASSWORD: ${{ secrets.OET_ADMIN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/wqa/run.mjs" run
      - name: Safety net (fault flags off, learners per the cleanup policy)
        if: ${{ always() }}
        env:
          OET_ADMIN_EMAIL: ${{ secrets.OET_ADMIN_EMAIL }}
          OET_ADMIN_PASSWORD: ${{ secrets.OET_ADMIN_PASSWORD }}
        run: node "$RUNNER_TEMP/wqa/run.mjs" safety-net
      - name: Upload evidence (tables, verdicts, facts)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: writing-prod-qa-evidence
          path: writing-prod-qa-out/evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload media (clipped screenshots)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: writing-prod-qa-media
          path: writing-prod-qa-out/media/
          if-no-files-found: ignore
          retention-days: 3
