name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'lib/mobile/**'
      - 'lib/auth-client.ts'
      - 'lib/auth-routes.ts'
      - 'lib/auth/**'
      - 'lib/auth-storage.ts'
      - 'contexts/auth-context.tsx'
      - 'components/auth/**'
      - 'app/(auth)/**'
      - 'components/mobile/**'
      - 'app/providers.tsx'
      - 'app/providers/**'
      - 'components/shell/**'
      - 'components/videos/**'
      - 'components/domain/catalog/promo-hero-slider.tsx'
      - 'contexts/accessibility-context.tsx'
      - 'hooks/use-media-preferences.ts'
      - 'lib/query/**'
      - 'tests/performance/**'
      - 'playwright.performance.config.ts'
      - '.github/workflows/mobile-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'lib/mobile/**'
      - 'lib/auth-client.ts'
      - 'lib/auth-routes.ts'
      - 'lib/auth/**'
      - 'lib/auth-storage.ts'
      - 'contexts/auth-context.tsx'
      - 'components/auth/**'
      - 'app/(auth)/**'
      - 'components/mobile/**'
      - 'app/providers.tsx'
      - 'app/providers/**'
      - 'components/shell/**'
      - 'components/videos/**'
      - 'components/domain/catalog/promo-hero-slider.tsx'
      - 'contexts/accessibility-context.tsx'
      - 'hooks/use-media-preferences.ts'
      - 'lib/query/**'
      - 'tests/performance/**'
      - 'playwright.performance.config.ts'
      - '.github/workflows/mobile-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Capacitor 7 Android compiles against Java 21 (source/target release 21);
  # JDK 17 fails with "invalid source release: 21".
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ── Lint & Type Check ──────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm run lint

  # ── Mobile Unit Tests ──────────────────────────────────────────
  unit-tests:
    name: Mobile Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run mobile unit tests
        run: pnpm exec vitest run --reporter=verbose lib/mobile/ components/mobile/

  # ── Android Debug Build ────────────────────────────────────────
  android-build:
    name: Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build
        env:
          CAPACITOR_APP_URL: https://app.oetwithdrhesham.co.uk

      - name: Capacitor sync
        run: pnpm exec cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  android-runtime-smoke:
    name: Android Emulator Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: android-build
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: output/native/android

      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            # android-emulator-runner invokes this block with POSIX sh, not
            # Bash. Keep strict mode portable so the runtime smoke reaches
            # the install/launch assertions on every hosted runner.
            set -eu
            mkdir -p "$GITHUB_WORKSPACE/output/native/android"
            adb install -r "$GITHUB_WORKSPACE/output/native/android/app-debug.apk"
            adb shell am force-stop com.oetwithdrhesham.app
            adb shell am start -W -n com.oetwithdrhesham.app/.MainActivity
            attempt=1; while [ "$attempt" -le 20 ]; do if adb shell pidof com.oetwithdrhesham.app | grep -q '[0-9]'; then break; fi; [ "$attempt" -eq 20 ] && { echo 'Android app did not stay alive after launch.' >&2; exit 1; }; attempt=$((attempt + 1)); sleep 1; done
            adb shell pidof com.oetwithdrhesham.app
            adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/output/native/android/activity.txt"
            grep -q 'com.oetwithdrhesham.app/.MainActivity' "$GITHUB_WORKSPACE/output/native/android/activity.txt"
            adb logcat -d -t 1000 -s AndroidRuntime:E > "$GITHUB_WORKSPACE/output/native/android/logcat.txt" || true
            if grep -Eq 'FATAL EXCEPTION|Process: com.oetwithdrhesham.app' "$GITHUB_WORKSPACE/output/native/android/logcat.txt"; then echo 'Android app crash signature detected.' >&2; exit 1; fi

      - name: Upload Android runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-smoke-${{ github.run_id }}
          path: output/native/android
          if-no-files-found: warn
          retention-days: 14

  # ── iOS Build Check ────────────────────────────────────────────
  ios-build:
    name: iOS Build Check
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build
        env:
          CAPACITOR_APP_URL: https://app.oetwithdrhesham.co.uk

      - name: Capacitor sync
        run: pnpm exec cap sync ios

      # Apple has required Xcode 26+ with the iOS 26 SDK for every App Store
      # Connect upload since 2026-04-28. Assert the toolchain rather than pin an
      # exact Xcode build: hosted images rotate minor versions (26.0.1 … 26.6 are
      # all present today) and a hard pin breaks the moment it is removed.
      - name: Assert a current Xcode toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode_major="$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)"
          if [ "${xcode_major:-0}" -lt 26 ]; then
            echo "::error::App Store Connect requires Xcode 26 or later since 2026-04-28; this runner has Xcode ${xcode_major:-unknown}." >&2
            exit 1
          fi
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $sdk_version"
          case "$sdk_version" in
            26.*|27.*) ;;
            *) echo "::error::App Store Connect requires the iOS 26 SDK or later; this runner has $sdk_version." >&2; exit 1 ;;
          esac

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      # Podfile.lock is not committed, so the transitive pod graph — and the
      # deployment target each pod requires — is re-resolved on every build and
      # is not pinned anywhere in the repository. Record what was actually
      # resolved as build evidence, and state the gap rather than letting it
      # drift unseen.
      - name: Record the resolved CocoaPods lock
        working-directory: ios/App
        run: |
          if git ls-files --error-unmatch Podfile.lock >/dev/null 2>&1; then
            echo "Podfile.lock is committed — pod resolution is reproducible."
          else
            echo "::warning::ios/App/Podfile.lock is not committed, so CocoaPods re-resolves the transitive pod graph on every build. Commit the lock this run produced to make iOS builds reproducible."
          fi
          if [ -f Podfile.lock ]; then
            echo "Resolved pods:"
            grep -E '^  - ' Podfile.lock | head -40
          fi

      - name: Build iOS (no code sign)
        working-directory: ios/App
        run: |
          set -euo pipefail
          # Log to a file rather than piping through a pretty-printer: xcpretty is
          # not installed on current runner images, and a missing formatter must
          # not be able to fail the build. The log is uploaded as evidence.
          log="$RUNNER_TEMP/xcodebuild-ios.log"
          if ! xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/AppDerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > "$log" 2>&1; then
            echo "xcodebuild failed — last 200 lines:" >&2
            tail -200 "$log" >&2
            exit 1
          fi
          tail -30 "$log"

      # Representative device classes across the lowest and highest iOS runtimes
      # the runner has. The bundle identifier is read from the built app: the iOS
      # bundle ID (com.oetprep.learner) and the Android applicationId
      # (com.oetwithdrhesham.app) are deliberately different, so a hardcoded
      # value here targets the wrong app.
      #
      # The declared minimum (iOS 16.4) has no simulator runtime on hosted images;
      # the script reports that as NOT VERIFIED and records it in a coverage
      # report instead of skipping silently.
      - name: Launch app on iOS simulators
        run: |
          node scripts/apple/run-ios-simulator-smoke.mjs \
            --app "$RUNNER_TEMP/AppDerivedData/Build/Products/Debug-iphonesimulator/App.app" \
            --out output/native/ios

      - name: Upload iOS simulator + build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-runtime-smoke-${{ github.run_id }}
          path: |
            output/native/ios
            ${{ runner.temp }}/xcodebuild-ios.log
            ios/App/Podfile.lock
          if-no-files-found: warn
          retention-days: 14
