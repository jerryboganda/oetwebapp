name: Tauri Desktop CI

# PR + push gate for the Tauri 2 desktop shell (src-tauri/) and shared runtime contract.
# Closes the gap left by tauri-desktop-release.yml (which only builds on tags): this
# runs the Rust toolchain gates that were previously ungated — fmt, clippy (-D warnings),
# cargo test — plus a compile smoke and the desktopBridge conformance test.
#
# Runs on windows-latest because the shell has cfg(windows)-only code (Job Object,
# WebView2) that only compiles/tests on Windows — the production target platform.
# Repo-wide tsc/lint are already gated by qa-smoke.yml and are intentionally not duplicated here.

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'inject/**'
      - 'types/desktop.d.ts'
      - '.github/workflows/tauri-ci.yml'
      - 'app/providers.tsx'
      - 'app/providers/**'
      - 'components/shell/**'
      - 'components/mobile/**'
      - 'components/videos/**'
      - 'components/domain/catalog/promo-hero-slider.tsx'
      - 'contexts/accessibility-context.tsx'
      - 'hooks/use-media-preferences.ts'
      - 'lib/query/**'
      - 'tests/performance/**'
      - 'playwright.performance.config.ts'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'inject/**'
      - 'types/desktop.d.ts'
      - '.github/workflows/tauri-ci.yml'
      - 'app/providers.tsx'
      - 'app/providers/**'
      - 'components/shell/**'
      - 'components/mobile/**'
      - 'components/videos/**'
      - 'components/domain/catalog/promo-hero-slider.tsx'
      - 'contexts/accessibility-context.tsx'
      - 'hooks/use-media-preferences.ts'
      - 'lib/query/**'
      - 'tests/performance/**'
      - 'playwright.performance.config.ts'
  workflow_dispatch:

concurrency:
  group: tauri-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  rust:
    name: Rust gate (fmt + clippy + test + build) — windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      # Repo has content files with paths > Windows MAX_PATH (260); enable long
      # paths before checkout so the Windows runner can write them.
      - name: Enable Git long paths
        working-directory: ${{ github.workspace }}
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-features
      - name: cargo build (compile smoke)
        run: cargo build

      - name: Windows desktop launch smoke
        shell: pwsh
        env:
          OET_DESKTOP_SKIP_TRAY: '1'
        run: |
          $binary = Join-Path (Get-Location) 'target\debug\oet-desktop.exe'
          $desktopProcess = Start-Process -FilePath $binary -WorkingDirectory (Get-Location) -PassThru
          try {
            Start-Sleep -Seconds 15
            $desktopProcess.Refresh()
            if ($desktopProcess.HasExited) {
              if ($desktopProcess.ExitCode -ne 0) {
                throw "Tauri desktop process failed during headless launch smoke (code $($desktopProcess.ExitCode))."
              }
              Write-Host "Tauri desktop process exited cleanly; the hosted Windows runner has no interactive window station."
            } else {
              Write-Host "Tauri desktop process stayed alive for the Windows launch smoke."
            }
          } finally {
            $desktopProcess.Refresh()
            if (-not $desktopProcess.HasExited) {
              Stop-Process -Id $desktopProcess.Id -Force
            }
          }

  # The macOS release artifact is Universal 2 (arm64 + x86_64), but until this
  # job was split, only the host architecture was ever executed — the Intel
  # slice was cross-compiled and never once run. Each lane below proves three
  # separate things: the runner is genuinely that processor family, the built
  # binary carries that slice, and it launches and stays alive.
  #
  # Runner facts (actions/runner-images): macos-latest is macOS 26 on Apple
  # Silicon arm64; macos-15-intel is the x64 image. GitHub retires the x86_64
  # macOS images in August 2027, so the Intel lane has a known end date — see
  # docs/APPLE_COMPATIBILITY_MATRIX.md. There is also a macos-26-intel label
  # (Intel on macOS 26, Intel's final macOS) which belongs to the larger-runner
  # family; add it here if the plan covers those runners.
  runtime-macos:
    name: macOS launch smoke — ${{ matrix.arch.name }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - name: arm64 (Apple Silicon)
            os: macos-latest
            expected: arm64
            target: aarch64-apple-darwin
          - name: x86_64 (Intel)
            os: macos-15-intel
            expected: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.arch.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch.target }}

      # "It started" only means "it ran natively" if the hardware really is that
      # family. uname alone is weak evidence, so also read the CPU brand: it is
      # the difference between executing on Apple Silicon and executing an
      # x86_64 slice under Rosetta.
      - name: Assert native ${{ matrix.arch.expected }} hardware
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          cpu="$(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo unknown)"
          echo "Runner machine: $actual"
          echo "Runner CPU: $cpu"

          if [ "$actual" != "${{ matrix.arch.expected }}" ]; then
            echo "::error::Expected a ${{ matrix.arch.expected }} runner but got '$actual'; this lane would not prove native execution." >&2
            exit 1
          fi

          case "${{ matrix.arch.expected }}" in
            arm64)
              case "$cpu" in
                *Apple*) ;;
                *) echo "::error::Expected Apple Silicon hardware but the CPU reports '$cpu'." >&2; exit 1 ;;
              esac
              ;;
            x86_64)
              case "$cpu" in
                *Intel*) ;;
                *) echo "::error::Expected Intel hardware but the CPU reports '$cpu'." >&2; exit 1 ;;
              esac
              ;;
          esac

      - name: cargo build (${{ matrix.arch.target }})
        working-directory: src-tauri
        run: cargo build --target ${{ matrix.arch.target }}

      - name: Assert the binary carries an ${{ matrix.arch.expected }} slice
        working-directory: src-tauri
        run: |
          set -euo pipefail
          binary="target/${{ matrix.arch.target }}/debug/oet-desktop"
          echo "lipo -archs: $(lipo -archs "$binary")"
          if ! lipo -archs "$binary" | tr ' ' '\n' | grep -qx "${{ matrix.arch.expected }}"; then
            echo "::error::$binary does not contain a ${{ matrix.arch.expected }} slice." >&2
            exit 1
          fi

      - name: macOS desktop launch smoke
        working-directory: src-tauri
        run: |
          set -euo pipefail
          binary="target/${{ matrix.arch.target }}/debug/oet-desktop"
          "$binary" > "$RUNNER_TEMP/oet-desktop.log" 2>&1 &
          desktop_pid=$!
          cleanup() {
            kill "$desktop_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 15); do
            if ! kill -0 "$desktop_pid" 2>/dev/null; then
              echo "Tauri desktop process exited during the ${{ matrix.arch.name }} launch smoke." >&2
              cat "$RUNNER_TEMP/oet-desktop.log" >&2
              exit 1
            fi
            sleep 1
          done
          echo "Tauri desktop process stayed alive for the ${{ matrix.arch.name }} launch smoke."

  conformance:
    name: desktopBridge contract conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bridge conformance (types/desktop.d.ts parity)
        run: pnpm vitest run src-tauri/__tests__/desktop-bridge-conformance.test.ts
