name: Build images
run-name: ${{ inputs.benchmark && format('Benchmark build {0}', github.sha) || format('Build images {0}', github.sha) }}

# Build half of the former "Build & Deploy (web + API)": classifies the push,
# runs the seconds-long syntax gate (plus the Writing gates only when Writing
# files changed), builds the web (Next.js/Turbopack), API (.NET), backup-sidecar
# and agent-gateway images OFF-BOX on GitHub's 16 GB runners, pushes them to
# GHCR, and generates the idempotent production migration SQL as an artifact.
# NO production secrets, NO SSH - the rollout lives in production-deploy.yml.
#
# Why the split (owner directive 2026-10-03): several agents may push within
# minutes. Deploying serializes (one router flip at a time), but BUILDING does
# not need to: this workflow has no cross-SHA concurrency group, so every
# pushed SHA builds in parallel, and the deploy workflow (triggered by
# `workflow_run`) starts the moment its build succeeds.
#
# Why not build on the VPS: it is a shared host with 60+ co-tenant containers;
# an in-place `next build` OOM-cascades and can take the whole box down.
# No build minutes are billed (public repo).

on:
  push:
    branches: [main]
    # Ship only when something the DEPLOYED ARTIFACTS actually consume changed
    # (owner directive 2026-10-03: minimum deploy time). A push touching only
    # tests, docs, ledgers or CI bookkeeping starts NO build and NO rollout.
    # Add a path here the moment it becomes a build input.
    paths:
      - 'app/**'
      - 'pages/**'
      - 'components/**'
      - 'contexts/**'
      - 'hooks/**'
      - 'lib/**'
      - 'public/**'
      - 'messages/**'
      - 'types/**'
      # Every root-level source/config file the two builds consume: i18n.ts,
      # next.config.ts, proxy.ts, middleware.ts, instrumentation*.ts,
      # sentry.*.config.ts, tsconfig.json, package.json, postcss.config.mjs.
      # Explicit extensions on purpose: brace globs are not part of the
      # path-filter spec and would silently never match.
      - '*.ts'
      - '*.tsx'
      - '*.mjs'
      - '*.cjs'
      - '*.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - '.dockerignore'
      - 'Dockerfile'
      - 'Dockerfile.dockerignore'
      - 'backend/**'
      - 'global.json'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'NuGet.config'
      - 'rulebooks/**'
      - 'data/**'
      - 'agent-gateway/**'
      - 'scripts/backup/**'
      - 'scripts/deploy/**'
      - 'docker-compose.production.yml'
      - 'docker-compose.production.*.yml'
      - '.env.production.example'
      - '.github/workflows/build-images.yml'
      - '.github/workflows/production-deploy.yml'
      - 'tests/writing-regression/**'
      - '!TASKS.json'
      - '!backend/tests/**'
      - '!backend/**/*.md'
      - '!playwright*.ts'
      - '!vitest*.ts'
  # A PR run proves the workflow itself before the merge (routing, retag-reuse,
  # the contract guards). It can never deploy: production-deploy.yml only acts
  # on a Build images run whose head branch is `main`.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: 'Rebuild all components instead of immutable reuse'
        type: boolean
        default: false
      benchmark:
        description: 'Cold-cache build measurement only: never push images or deploy'
        type: boolean
        default: false
      writing_gate:
        description: 'Exercise the unchanged mandatory Writing checks for release evidence'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  packages: write

# No cross-SHA lock: builds for different SHAs run in parallel. One SHA is
# cancelled in favour of itself; Rollout serialization lives in the deploy
# workflow's `production-deploy` concurrency group.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

env:
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
  API_IMAGE: ghcr.io/${{ github.repository }}-api:${{ github.sha }}
  DB_BACKUP_IMAGE: ghcr.io/${{ github.repository }}-db-backup:${{ github.sha }}
  AGENT_GATEWAY_IMAGE: ghcr.io/${{ github.repository }}-agent-gateway:${{ github.sha }}

jobs:
  # One cheap classification job replaces the duplicate git-diff detection
  # that used to live inside writing-regression-gate, so per-job gating
  # (Writing gates, migration SQL) reads one source of truth.
  changes:
    name: Detect what changed
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      web: ${{ steps.detect.outputs.web }}
      api: ${{ steps.detect.outputs.api }}
      backup: ${{ steps.detect.outputs.backup }}
      gateway: ${{ steps.detect.outputs.gateway }}
      writing: ${{ steps.detect.outputs.writing }}
      baseline: ${{ steps.detect.outputs.baseline }}
      reuse_matrix: ${{ steps.detect.outputs.reuse_matrix }}
      reuse_count: ${{ steps.detect.outputs.reuse_count }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Compare the complete successful-ancestor input range
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_ALL: ${{ inputs.rebuild_all || inputs.benchmark || false }}
          FORCE_WRITING: ${{ inputs.writing_gate || false }}
        run: node scripts/deploy/release-manifest.mjs detect

  syntax-gate:
    name: Syntax gate (seconds)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # The gate diffs `github.event.before..HEAD`, so the base commit must be
      # present - but a full-history clone on this repo costs ~30s and both
      # build jobs wait for this one. Depth 2 + one targeted fetch is enough;
      # `--unshallow` is the rare (multi-hundred-commit) fallback.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Make the comparison base available
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          if [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -qE '^0+$'; then
            git fetch --no-tags --depth=1 origin "$BASE" || git fetch --no-tags --unshallow || true
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seconds-long leftover-syntax gate
        env:
          SHIP_GATE_CI: "1"
        run: |
          node scripts/ship/pre-push-gate.mjs --self-test
          node scripts/ship/pre-push-gate.mjs --ci

  # The Writing model-answer recovery regression only runs when this push
  # touches Writing grader code, rules or the regression manifest. It used to
  # run inside syntax-gate, costing every deploy a full .NET build+test before
  # any image build could start.
  writing-model-answer-gate:
    name: Writing model-answer gate (on change)
    needs: [changes, build-api]
    if: ${{ always() && needs.changes.outputs.writing == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/cache@v4
        if: ${{ !inputs.benchmark }}
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        if: needs.build-api.result == 'success'
        with:
          name: api-release-${{ github.sha }}
          path: output/api-release
      - name: Writing model-answer recovery regression gate
        run: |
          set -euo pipefail
          test_project=backend/tests/OetLearner.Api.Tests/OetLearner.Api.Tests.csproj
          dotnet restore "$test_project" --nologo
          reference_args=()
          if [ -f output/api-release/api-references.tar.gz ]; then
            metadata=output/api-release/api.json
            test "$(jq -r '.sha' "$metadata")" = "$GITHUB_SHA"
            test "$(jq -r '.runId' "$metadata")" = "$GITHUB_RUN_ID"
            if [ "$(jq -r '.sdk' "$metadata")" = "$(dotnet --version)" ]; then
              expected="$(jq -r '.referencesChecksum' "$metadata")"
              actual="$(sha256sum output/api-release/api-references.tar.gz | cut -d' ' -f1)"
              test "$expected" = "$actual"
              tar -xzf output/api-release/api-references.tar.gz
              # This second project reference is not part of the API publish.
              dotnet build backend/scripts/StripeProductSeeder/StripeProductSeeder.csproj \
                -c Release --no-restore --nologo -p:RunAnalyzers=false
              reference_args=(-p:BuildProjectReferences=false -p:UseAppHost=false)
              echo "WRITING_API_REFERENCE_REUSE sha=$GITHUB_SHA sdk=$(dotnet --version)"
            else
              echo "::notice::SDK mismatch: explicitly compiling the API for Writing tests."
            fi
          else
            echo "::notice::No same-build API references: explicitly compiling the API for Writing tests."
          fi
          dotnet test "$test_project" -c Release --no-restore --nologo -p:RunAnalyzers=false \
            "${reference_args[@]}" --filter 'FullyQualifiedName~WritingRev8ModelAnswerGateTests' \
            --logger 'console;verbosity=normal' --logger 'trx;LogFileName=writing-gate.trx' \
            --results-directory output/writing-tests
          python -c 'import xml.etree.ElementTree as E; r=E.parse("output/writing-tests/writing-gate.trx"); c=r.find(".//{*}Counters"); assert c is not None and int(c.attrib["executed"]) > 0 and int(c.attrib["failed"]) == 0; print("WRITING_TESTS_EXECUTED", c.attrib["executed"])'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: writing-gate-${{ github.sha }}
          path: output/writing-tests
          if-no-files-found: warn

  # Writing grader prompt/model gate (recorded-artifact). When the push touches the
  # Writing prompt, house-style rules, rulebooks or the AI route, this verifies the
  # committed regression manifest matches the CURRENT prompt and records a passing run
  # (the live grading uses the owner's Claude Max subscription, which runners cannot
  # reach). No writing change -> the gate passes immediately and deploy is unaffected.
  writing-regression-gate:
    name: Writing grader regression (on change)
    needs: [changes]
    if: needs.changes.outputs.writing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checker self-test + verify manifest matches current prompt
        working-directory: tests/writing-regression
        run: |
          python selftest_checker.py
          python verify_manifest.py

  # Registry-only copies preserve a proven ancestor's immutable digest.
  retag:
    name: Retag unchanged ${{ matrix.image }}
    needs: [syntax-gate, guards, changes]
    if: ${{ needs.changes.outputs.reuse_count != '0' && github.event_name != 'pull_request' && !inputs.benchmark }}
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.reuse_matrix) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag ${{ matrix.image }} (inputs unchanged)
        env:
          SOURCE: ${{ matrix.source }}
          EXPECTED_DIGEST: ${{ matrix.digest }}
          DESTINATION: ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false --tag "$DESTINATION" "$SOURCE"
          actual="$(docker buildx imagetools inspect "$DESTINATION" --format '{{.Manifest.Digest}}')"
          test "$actual" = "$EXPECTED_DIGEST"
          echo "RELEASE_REUSE $DESTINATION digest=$actual source=$SOURCE"

  # Static deployment contract. Its own job (not a step of build-web) because
  # retag-reuse can SKIP build-web, and the contract must be checked on every
  # build run regardless of which images were rebuilt.
  guards:
    name: Deployment contract guards
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert production rollout is image-only
        run: |
          bash scripts/deploy/verify-image-only-rollout.sh
          bash scripts/deploy/verify-compute-offload.sh
      # Owner directive 2026-10-03: the CI/CD rules are mechanical, not prose.
      # This fails the run (and therefore the rollout) on ANY drift: a second
      # rollout path, a browser lane with an automatic trigger, an e2e job back
      # in qa-smoke, an un-filtered build trigger, a lost rollout gate.
      - name: Assert the pipeline contract
        run: |
          node scripts/deploy/verify-pipeline-contract.mjs
          node --test scripts/deploy/release-manifest.test.mjs
          bash -n scripts/deploy/auto-deploy-ghcr.sh
      - name: Parse the Windows deployment watcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/ship/watch-deploy.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }

  # NOTE: the build jobs deliberately do NOT `needs:` the Writing gates. A job
  # that needs a SKIPPED job is itself skipped -  chaining them made every
  # non-Writing push skip build-web/build-api/build-backup/build-agent-gateway
  # (and therefore the whole deploy). The Writing gates still fail the run on
  # their own, which blocks the rollout via deploy-production's
  # `conclusion == success` check.
  build-web:
    needs: [syntax-gate, guards, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        id: mount-cache
        if: ${{ github.event_name != 'pull_request' && !inputs.benchmark }}
        with:
          path: .build-cache
          key: web-mounts-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.npmrc', 'Dockerfile', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            web-mounts-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.npmrc', 'Dockerfile', 'next.config.ts') }}-
      - uses: reproducible-containers/buildkit-cache-dance@4b2444fec0c0fb9dbf175a96c094720a692ef810
        if: ${{ github.event_name != 'pull_request' && !inputs.benchmark }}
        with:
          cache-source: .build-cache/pnpm
          cache-target: /root/.local/share/pnpm/store
          scratch-dir: .buildkit-pnpm
          skip-extraction: ${{ steps.mount-cache.outputs.cache-hit == 'true' }}
      - uses: reproducible-containers/buildkit-cache-dance@4b2444fec0c0fb9dbf175a96c094720a692ef810
        if: ${{ github.event_name != 'pull_request' && !inputs.benchmark }}
        with:
          cache-source: .build-cache/next
          cache-target: /app/.next/cache
          scratch-dir: .buildkit-next
          skip-extraction: ${{ steps.mount-cache.outputs.cache-hit == 'true' }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push web
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: ${{ github.event_name != 'pull_request' && !inputs.benchmark }}
          provenance: false
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_BASE_URL=https://api.oetwithdrhesham.co.uk
            APP_URL=https://app.oetwithdrhesham.co.uk
            # 17 Sep 2026 handover: the public Mac DMG has not passed protected
            # playback QA on a real Mac, so the Mac download stays disabled and
            # candidates are pointed at the Web App. Remove this arg to
            # re-enable once the signed 0.7.10 build passes (see
            # docs/APPLE-RELEASE-EVIDENCE-PACK.md).
            NEXT_PUBLIC_MAC_DOWNLOAD_DISABLED=1
          cache-from: ${{ !inputs.benchmark && 'type=gha,scope=web' || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && !inputs.benchmark && 'type=gha,mode=max,scope=web' || '' }}

  build-api:
    needs: [syntax-gate, guards, changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      checksum: ${{ steps.sql.outputs.checksum }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        if: ${{ !inputs.benchmark }}
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish API on the Actions host
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" dotnet-ef --version 10.0.5 &
          ef_pid=$!
          dotnet restore backend/src/OetLearner.Api/OetLearner.Api.csproj --nologo
          rm -rf backend/publish
          # /m:1 + BuildInParallel=false + UseSharedCompilation=false were tuned
          # for a small build box. Hosted runners have 4 vCPU / 16 GB, so MSBuild
          # compiles in parallel again - this was the slowest image job.
          dotnet publish backend/src/OetLearner.Api/OetLearner.Api.csproj \
            --configuration Release \
            --output backend/publish \
            --no-restore \
            /p:UseAppHost=false \
            /p:ProduceReferenceAssembly=true \
            /p:UseSharedCompilation=true \
            /p:RunAnalyzers=false
          test -n "$(find backend/publish -mindepth 1 -maxdepth 1 -print -quit)"
          wait "$ef_pid"
      - name: Generate SQL from the exact published Release compilation
        id: sql
        env:
          WRITING_CHANGED: ${{ needs.changes.outputs.writing }}
        run: |
          set -euo pipefail
          mkdir -p output/api-release
          "$RUNNER_TEMP/dotnet-tools/dotnet-ef" migrations script --idempotent --no-build --configuration Release \
            --project backend/src/OetLearner.Api/OetLearner.Api.csproj \
            --startup-project backend/src/OetLearner.Api/OetLearner.Api.csproj \
            --output output/api-release/migrations.sql
          test -s output/api-release/migrations.sql
          checksum="$(sha256sum output/api-release/migrations.sql | cut -d' ' -f1)"
          references_checksum=""
          if [ "$WRITING_CHANGED" = "true" ]; then
            tar -czf output/api-release/api-references.tar.gz \
              backend/src/OetLearner.Api/bin/Release/net10.0/OetLearner.Api.dll \
              backend/src/OetLearner.Api/bin/Release/net10.0/OetLearner.Api.deps.json \
              backend/src/OetLearner.Api/bin/Release/net10.0/OetLearner.Api.runtimeconfig.json \
              backend/src/OetLearner.Api/obj/Release/net10.0/ref
            references_checksum="$(sha256sum output/api-release/api-references.tar.gz | cut -d' ' -f1)"
          fi
          jq -n --arg sha "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" --arg checksum "$checksum" \
            --arg sdk "$(dotnet --version)" --arg referencesChecksum "$references_checksum" \
            '{sha:$sha,runId:$run,checksum:$checksum,efVersion:"10.0.5",sdk:$sdk,referencesChecksum:$referencesChecksum}' \
            > output/api-release/api.json
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "API_SQL_GENERATED sha=$GITHUB_SHA run=$GITHUB_RUN_ID checksum=$checksum"
      - uses: actions/upload-artifact@v4
        with:
          name: api-release-${{ github.sha }}
          path: output/api-release
          if-no-files-found: error
          retention-days: 90
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile.runtime
          push: ${{ github.event_name != 'pull_request' && !inputs.benchmark }}
          provenance: false
          tags: ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          cache-from: ${{ !inputs.benchmark && 'type=gha,scope=api' || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && !inputs.benchmark && 'type=gha,mode=max,scope=api' || '' }}

  build-backup:
    needs: [syntax-gate, guards, changes]
    if: needs.changes.outputs.backup == 'true'
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backup sidecar
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/backup/Dockerfile
          push: ${{ github.event_name != 'pull_request' && !inputs.benchmark }}
          provenance: false
          tags: ghcr.io/${{ github.repository }}-db-backup:${{ github.sha }}
          cache-from: ${{ !inputs.benchmark && 'type=gha,scope=db-backup' || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && !inputs.benchmark && 'type=gha,mode=max,scope=db-backup' || '' }}

  build-agent-gateway:
    needs: [syntax-gate, guards, changes]
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push agent gateway (Google Antigravity SDK runtime)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-gateway
          file: ./agent-gateway/Dockerfile
          push: ${{ github.event_name != 'pull_request' && !inputs.benchmark }}
          provenance: false
          tags: ghcr.io/${{ github.repository }}-agent-gateway:${{ github.sha }}
          cache-from: ${{ !inputs.benchmark && 'type=gha,scope=agent-gateway' || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && !inputs.benchmark && 'type=gha,mode=max,scope=agent-gateway' || '' }}

  release-manifest:
    name: Publish verified release provenance
    needs: [changes, syntax-gate, guards, retag, build-web, build-api, build-backup, build-agent-gateway, writing-model-answer-gate, writing-regression-gate]
    if: ${{ always() && github.event_name != 'pull_request' && !inputs.benchmark && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.changes.result == 'success' }}
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bind immutable images and SQL to this successful release
        env:
          BASELINE: ${{ needs.changes.outputs.baseline }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          DB_BACKUP_CHANGED: ${{ needs.changes.outputs.backup }}
          AGENT_GATEWAY_CHANGED: ${{ needs.changes.outputs.gateway }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          DB_BACKUP_DIGEST: ${{ needs.build-backup.outputs.digest }}
          AGENT_GATEWAY_DIGEST: ${{ needs.build-agent-gateway.outputs.digest }}
          SQL_CHECKSUM: ${{ needs.build-api.outputs.checksum }}
        run: node scripts/deploy/release-manifest.mjs create
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: output/release.json
          if-no-files-found: error
          retention-days: 90
