name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - android
          - ios
          - both
        default: both
      version:
        description: 'Version name (e.g. 1.2.0)'
        required: true
        type: string
      version_code:
        description: 'Version code / build number (integer)'
        required: true
        type: string
      publish_vps_ipa:
        description: 'Also publish the IPA to the VPS feed (INTERNAL/ADMIN ONLY — never candidate-facing; candidates install via TestFlight/App Store)'
        required: false
        type: boolean
        default: false

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ── Android Release AAB ────────────────────────────────────────
  android-release:
    name: Android Release
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default installs the legacy 'tools' meta-package, which Google has
          # pulled from the SDK repository index (fails with "Failed to find
          # package 'tools'"). Gradle/AGP fetches platforms/build-tools itself.
          packages: 'platform-tools'

      - run: pnpm install --frozen-lockfile

      - name: Validate Android release inputs
        run: node scripts/qa/validate-mobile-release-inputs.mjs --platform=android --version="$MOBILE_VERSION" --version-code="$MOBILE_VERSION_CODE"
        env:
          MOBILE_VERSION: ${{ inputs.version }}
          MOBILE_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Set version
        working-directory: android/app
        env:
          MOBILE_VERSION: ${{ inputs.version }}
          MOBILE_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'build.gradle';
           const version = process.env.MOBILE_VERSION;
           const versionCode = process.env.MOBILE_VERSION_CODE;
           let content = fs.readFileSync(file, 'utf8');
           // Anchored to line-start (after only whitespace) so the file's own
           // explanatory comments -- which mention past "versionCode N" values
           // in prose above the real declaration -- can never be mistaken for
           // it. An unanchored /versionCode\s+\d+/ matches whichever occurs
           // first in the file, silently stamping the comment text and
           // leaving the real declaration (and thus the built AAB) on the
           // stale committed version -- exactly what happened on 2026-09-16.
           const versionCodeRe = /^(\s*)versionCode\s+\d+/m;
           const versionNameRe = /^(\s*)versionName\s+"[^"]+"/m;
           if (!versionCodeRe.test(content)) throw new Error('build.gradle is missing versionCode');
           if (!versionNameRe.test(content)) throw new Error('build.gradle is missing versionName');
           content = content.replace(versionCodeRe, `$1versionCode ${versionCode}`);
           content = content.replace(versionNameRe, `$1versionName "${version}"`);
           fs.writeFileSync(file, content);
          NODE

      - name: Build Next.js
        run: pnpm run build
        env:
          CAPACITOR_APP_URL: https://app.oetwithdrhesham.co.uk

      - name: Capacitor sync
        run: pnpm exec cap sync android

      - name: Decode keystore
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Create keystore.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const required = ['ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`${name} is required`);
          }
          fs.writeFileSync('android/keystore.properties', [
            'storeFile=release-keystore.jks',
            `storePassword=${process.env.ANDROID_KEYSTORE_PASSWORD}`,
            `keyAlias=${process.env.ANDROID_KEY_ALIAS}`,
            `keyPassword=${process.env.ANDROID_KEY_PASSWORD}`,
            '',
          ].join('\n'));
          NODE

      # OET_MOBILE_ATTEST_SECRET is read by android/app/build.gradle via
      # System.getenv and compiled into BuildConfig.OET_ATTEST_SECRET (video
      # playback attestation). A release build without it still succeeds but
      # refuses to sign attestations at runtime ("attestation secret not
      # embedded") — it never falls back to the public dev constant.
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
        env:
          OET_MOBILE_ATTEST_SECRET: ${{ secrets.OET_MOBILE_ATTEST_SECRET }}

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          OET_MOBILE_ATTEST_SECRET: ${{ secrets.OET_MOBILE_ATTEST_SECRET }}

      # Update-blocker guard: Android rejects updates signed with a different
      # key ("App not installed", only fixable by uninstall). The release APK
      # must carry the enrolled upload certificate — Play also rejects AABs
      # whose upload cert drifts. This pins the cert that shipped the
      # 1.4.7–1.4.9 lineage so a rotated/wrong keystore fails the release
      # instead of shipping an uninstall-or-nothing artifact.
      - name: Verify release signer matches pinned upload certificate
        env:
          PINNED_UPLOAD_CERT_SHA256: 41:5F:CB:E8:29:4A:64:4A:B8:13:3D:9D:75:2A:DC:D2:89:D0:B6:49:91:E5:1A:C7:E0:05:DD:A2:B6:07:7F:A9
        run: |
          set -euo pipefail
          actual=$(keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256:[[:space:]]*//')
          pinned_norm=$(printf '%s' "$PINNED_UPLOAD_CERT_SHA256" | tr -d ' :' | tr 'a-f' 'A-F')
          actual_norm=$(printf '%s' "$actual" | tr -d ' :' | tr 'a-f' 'A-F')
          if [ -z "$actual_norm" ]; then
            echo "::error::Could not read a signing certificate from the release APK."
            exit 1
          fi
          if [ "$actual_norm" != "$pinned_norm" ]; then
            echo "::error::Release APK signer does not match the pinned upload certificate."
            exit 1
          fi
          echo "Release signer matches pinned upload certificate."

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab-${{ inputs.version }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ inputs.version }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

  # ── iOS Release IPA ────────────────────────────────────────────
  publish-android:
    name: Publish signed Android release
    needs: android-release
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download signed Android artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: android-release-*-${{ inputs.version }}
          path: artifacts
          merge-multiple: true

      - name: Stage versioned release assets
        run: |
          set -euo pipefail
          mkdir -p stage
          test -s artifacts/app-release.apk
          test -s artifacts/app-release.aab
          mv artifacts/app-release.apk "stage/OET-with-Dr-Hesham-${{ inputs.version }}.apk"
          mv artifacts/app-release.aab "stage/OET-with-Dr-Hesham-${{ inputs.version }}.aab"
          node scripts/release/assemble-mobile-manifest.mjs \
            --platform=android \
            --version="${{ inputs.version }}" \
            --version-code="${{ inputs.version_code }}" \
            --artifact-dir=stage \
            --public-base=https://app.oetwithdrhesham.co.uk \
            --out=stage/current.json

      # Downgrade guard: a VPS feed serving a lower versionCode than what is
      # live bricks updaters with "App not installed" until manual reinstall
      # (same user-facing symptom as a signature conflict). Play enforces this
      # server-side; the VPS feed needs this explicit check.
      #
      # Two very different cases used to share a single `exit 1`:
      #   expect <  live  -> a real downgrade. Refuse, loudly.
      #   expect == live  -> the identical build is already published. Re-running
      #                      a release for an unchanged versionCode is a no-op,
      #                      not a defect; failing here painted the whole run red
      #                      and trained everyone to ignore the signal.
      - name: Reject VPS feed downgrade
        id: feed_gate
        env:
          EXPECT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          feed_json=$(curl --fail --silent --show-error --location 'https://app.oetwithdrhesham.co.uk/api/releases/native?platform=android' || echo '{}')
          live_code=$(node -e "const f = JSON.parse(process.argv[1] || '{}'); console.log(Number(f.versionCode) || 0)" "$feed_json")
          echo "Live feed versionCode: ${live_code}; releasing: ${EXPECT_VERSION_CODE}"
          if [ "$live_code" -gt 0 ] && [ "${EXPECT_VERSION_CODE}" -lt "$live_code" ]; then
            echo "::error::Release version_code ${EXPECT_VERSION_CODE} is OLDER than the live VPS feed (${live_code}). Refusing to downgrade."
            exit 1
          fi
          if [ "$live_code" -gt 0 ] && [ "${EXPECT_VERSION_CODE}" -eq "$live_code" ]; then
            echo "::notice::versionCode ${EXPECT_VERSION_CODE} is already live on the VPS feed; nothing to upload."
            echo "already_live=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_live=false" >> "$GITHUB_OUTPUT"

      - name: Upload latest Android release to the VPS
        if: steps.feed_gate.outputs.already_live != 'true'
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          CHANNEL: android
          VERSION: ${{ inputs.version }}
          SRC_DIR: stage
        run: bash scripts/release/upload-native-release.sh

      - name: Verify published APK
        run: |
          set -euo pipefail
          feed="https://app.oetwithdrhesham.co.uk/api/releases/native?platform=android"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location "$feed" -o published-android.json; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const feed = JSON.parse(fs.readFileSync('published-android.json', 'utf8'));
          if (feed.version !== '${{ inputs.version }}') throw new Error('Published Android version mismatch');
          if (!feed.downloadUrl?.startsWith('https://app.oetwithdrhesham.co.uk/releases/')) throw new Error('Published Android URL is untrusted');
          console.log(feed.downloadUrl);
          NODE
          artifact_url=$(node -p "require('./published-android.json').downloadUrl")
          curl --fail --silent --show-error --location --range 0-0 "$artifact_url" -o /dev/null

  ios-release:
    name: iOS Release
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate iOS release inputs
        run: node scripts/qa/validate-mobile-release-inputs.mjs --platform=ios --version="$MOBILE_VERSION" --version-code="$MOBILE_VERSION_CODE"
        env:
          MOBILE_VERSION: ${{ inputs.version }}
          MOBILE_VERSION_CODE: ${{ inputs.version_code }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID_IOS: ${{ secrets.ASC_KEY_ID_IOS }}
          ASC_PRIVATE_KEY_IOS: ${{ secrets.ASC_PRIVATE_KEY_IOS }}

      - name: Build Next.js
        run: pnpm run build
        env:
          CAPACITOR_APP_URL: https://app.oetwithdrhesham.co.uk

      - name: Capacitor sync
        run: pnpm exec cap sync ios

      # Apple has required Xcode 26+ with the iOS 26 SDK for every App Store
      # Connect upload since 2026-04-28. A release that quietly built with an
      # older toolchain would be rejected at upload time, so assert it up front.
      - name: Assert a current Xcode toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode_major="$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)"
          if [ "${xcode_major:-0}" -lt 26 ]; then
            echo "::error::App Store Connect requires Xcode 26 or later since 2026-04-28; this runner has Xcode ${xcode_major:-unknown}." >&2
            exit 1
          fi
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $sdk_version"
          case "$sdk_version" in
            26.*|27.*) ;;
            *) echo "::error::App Store Connect requires the iOS 26 SDK or later; this runner has $sdk_version." >&2; exit 1 ;;
          esac

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Set version
        env:
          MOBILE_VERSION: ${{ inputs.version }}
          MOBILE_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          cd ios/App
          agvtool new-marketing-version "$MOBILE_VERSION"
          agvtool new-version -all "$MOBILE_VERSION_CODE"

      # Video playback attestation: AttestationSecret.swift reads the
      # OET_ATTEST_SECRET Info.plist key, which is injected here at build time
      # only (the committed Info.plist deliberately has no such key). Without
      # it a release build refuses to sign attestations at runtime — it never
      # falls back to the public dev constant.
      - name: Inject playback attestation secret into Info.plist
        env:
          OET_MOBILE_ATTEST_SECRET: ${{ secrets.OET_MOBILE_ATTEST_SECRET }}
        run: |
          if [ -z "$OET_MOBILE_ATTEST_SECRET" ]; then
            echo "::warning::OET_MOBILE_ATTEST_SECRET is not set — this IPA will refuse to sign playback attestations."
            exit 0
          fi
          /usr/libexec/PlistBuddy -c "Add :OET_ATTEST_SECRET string $OET_MOBILE_ATTEST_SECRET" ios/App/App/Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :OET_ATTEST_SECRET $OET_MOBILE_ATTEST_SECRET" ios/App/App/Info.plist
          echo "Injected OET_ATTEST_SECRET into ios/App/App/Info.plist."

      # 17 Sep 2026 handover: signing moved from manually-supplied cert/profile
      # secrets (never configured) to App Store Connect API-key cloud signing.
      # xcodebuild -allowProvisioningUpdates with -authenticationKey* creates
      # and fetches the Apple Distribution certificate and App Store profile
      # on demand via the ASC API (Developer-role key ASC_KEY_ID_IOS), so no
      # .p12/.mobileprovision secrets are needed. Dormant until the ASC keys
      # authenticate (currently 401-blocked; see .tools-state/apple-api-keys).
      - name: Stage App Store Connect API key
        env:
          ASC_KEY_ID_IOS: ${{ secrets.ASC_KEY_ID_IOS }}
          ASC_PRIVATE_KEY_IOS: ${{ secrets.ASC_PRIVATE_KEY_IOS }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID_IOS" ] || [ -z "$ASC_PRIVATE_KEY_IOS" ]; then
            echo "::error::ASC_KEY_ID_IOS / ASC_PRIVATE_KEY_IOS are not configured — cannot sign the iOS build."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc" "$HOME/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY_IOS" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID_IOS}.p8"
          # altool/notarytool look the key up in well-known paths:
          cp "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID_IOS}.p8" "$HOME/private_keys/"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID_IOS}.p8" "$HOME/private_keys/AuthKey_${ASC_KEY_ID_IOS}.p8"
          echo "ASC key staged for ${ASC_KEY_ID_IOS}."

      - name: Build archive
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID_IOS: ${{ secrets.ASC_KEY_ID_IOS }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID_IOS}.p8" \
            -authenticationKeyID "$ASC_KEY_ID_IOS" \
            -authenticationKeyIssuer "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID_IOS: ${{ secrets.ASC_KEY_ID_IOS }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const teamId = process.env.APPLE_TEAM_ID;
          if (!teamId) throw new Error('APPLE_TEAM_ID is required');
          const escapedTeamId = teamId
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&apos;');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'ExportOptions.plist'), `<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <!-- Renamed from "app-store" in Xcode 15.4; the old value is
                 deprecated and warns on export. -->
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${escapedTeamId}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          `);
          NODE
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID_IOS}.p8" \
            -authenticationKeyID "$ASC_KEY_ID_IOS" \
            -authenticationKeyIssuer "$ASC_ISSUER_ID"

      # Inspects the exported IPA itself. The artifact is what the App Store and
      # the device act on, and Xcode resolves the deployment target, device
      # families and capabilities into it at export time — so the project files
      # agreeing with apple-compatibility.json is not sufficient proof. Runs
      # before the upload so a non-conforming IPA is never published.
      - name: Validate the exported IPA against the support matrix
        run: |
          node scripts/apple/assert-ios-ipa.mjs \
            --root "$RUNNER_TEMP/ipa" \
            --require-signature

      # Handover 4A/4E: production iOS updates are distributed through the
      # App Store, so the signed IPA goes straight to TestFlight. The raw
      # IPA is never a candidate download (no .ipa buttons anywhere).
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID_IOS: ${{ secrets.ASC_KEY_ID_IOS }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -print -quit)"
          test -n "$ipa" && test -s "$ipa"
          xcrun altool --upload-app --type ios -f "$ipa" \
            --apiKey "$ASC_KEY_ID_IOS" --apiIssuer "$ASC_ISSUER_ID"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa-${{ inputs.version }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 90

  publish-ios:
    name: Publish signed iOS release (internal VPS copy)
    needs: ios-release
    # Internal/administrative IPA mirror only. Candidates must install via
    # TestFlight / the App Store - a raw .ipa is never candidate-facing
    # (handover 4A). Defaults to skip.
    if: (inputs.platform == 'ios' || inputs.platform == 'both') && inputs.publish_vps_ipa == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download signed iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-release-ipa-${{ inputs.version }}
          path: artifacts

      - name: Stage versioned release assets
        run: |
          set -euo pipefail
          mkdir -p stage
          ipa=$(find artifacts -name '*.ipa' | head -1)
          test -n "$ipa" && test -s "$ipa"
          mv "$ipa" "stage/OET-with-Dr-Hesham-${{ inputs.version }}.ipa"
          node scripts/release/assemble-mobile-manifest.mjs \
            --platform=ios \
            --version="${{ inputs.version }}" \
            --version-code="${{ inputs.version_code }}" \
            --artifact-dir=stage \
            --public-base=https://app.oetwithdrhesham.co.uk \
            --out=stage/current.json

      # See the Android twin above: `expect == live` is an idempotent republish
      # and must skip the upload, not fail the job. Only `expect < live` is a
      # real downgrade worth refusing.
      - name: Reject VPS feed downgrade
        id: feed_gate
        env:
          EXPECT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          feed_json=$(curl --fail --silent --show-error --location 'https://app.oetwithdrhesham.co.uk/api/releases/native?platform=ios' || echo '{}')
          live_code=$(node -e "const f = JSON.parse(process.argv[1] || '{}'); console.log(Number(f.versionCode) || 0)" "$feed_json")
          echo "Live feed versionCode: ${live_code}; releasing: ${EXPECT_VERSION_CODE}"
          if [ "$live_code" -gt 0 ] && [ "${EXPECT_VERSION_CODE}" -lt "$live_code" ]; then
            echo "::error::Release version_code ${EXPECT_VERSION_CODE} is OLDER than the live VPS feed (${live_code}). Refusing to downgrade."
            exit 1
          fi
          if [ "$live_code" -gt 0 ] && [ "${EXPECT_VERSION_CODE}" -eq "$live_code" ]; then
            echo "::notice::versionCode ${EXPECT_VERSION_CODE} is already live on the VPS feed; nothing to upload."
            echo "already_live=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_live=false" >> "$GITHUB_OUTPUT"

      - name: Upload latest iOS release to the VPS
        if: steps.feed_gate.outputs.already_live != 'true'
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          CHANNEL: ios
          VERSION: ${{ inputs.version }}
          SRC_DIR: stage
        run: bash scripts/release/upload-native-release.sh
