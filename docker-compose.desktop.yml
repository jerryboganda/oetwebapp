services:
  postgres:
    # See docker-compose.local.yml — pgvector/pgvector:pg17 ships the `vector`
    # extension that the Writing V2 migration 20260612120000 enables.
    image: pgvector/pgvector:pg17
    container_name: oet-desktop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oet_learner_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - oet_desktop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oet_learner_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

  learner-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oet-desktop-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=oet_learner_dev;Username=postgres;Password=postgres
      Auth__UseDevelopmentAuth: "false"
      Bootstrap__AutoMigrate: "true"
      Bootstrap__SeedDemoData: "true"
      Platform__PublicApiBaseUrl: http://localhost:5198
      Platform__PublicWebBaseUrl: http://localhost:3000
      ExternalAuth__Google__Enabled: ${EXTERNAL_AUTH_GOOGLE_ENABLED:-false}
      ExternalAuth__Google__ClientId: ${EXTERNAL_AUTH_GOOGLE_CLIENT_ID:-}
      ExternalAuth__Google__ClientSecret: ${EXTERNAL_AUTH_GOOGLE_CLIENT_SECRET:-}
      ExternalAuth__Facebook__Enabled: ${EXTERNAL_AUTH_FACEBOOK_ENABLED:-false}
      ExternalAuth__Facebook__ClientId: ${EXTERNAL_AUTH_FACEBOOK_CLIENT_ID:-}
      ExternalAuth__Facebook__ClientSecret: ${EXTERNAL_AUTH_FACEBOOK_CLIENT_SECRET:-}
      ExternalAuth__LinkedIn__Enabled: ${EXTERNAL_AUTH_LINKEDIN_ENABLED:-false}
      ExternalAuth__LinkedIn__ClientId: ${EXTERNAL_AUTH_LINKEDIN_CLIENT_ID:-}
      ExternalAuth__LinkedIn__ClientSecret: ${EXTERNAL_AUTH_LINKEDIN_CLIENT_SECRET:-}
      Billing__CheckoutBaseUrl: http://localhost:3000/billing/checkout
      Proxy__TrustForwardHeaders: "false"
      Proxy__EnforceHttps: "false"
      Features__EnableSwagger: "true"
      Storage__LocalRootPath: /var/opt/oet-learner/storage
      ANTIGRAVITY_GATEWAY_ROUTES_ENABLED: ${ANTIGRAVITY_GATEWAY_ROUTES_ENABLED:-false}
      AGENTGATEWAY_INTERNAL_SERVICE_TOKEN: ${AGENTGATEWAY_INTERNAL_SERVICE_TOKEN:-}
    volumes:
      - oet_desktop_storage:/var/opt/oet-learner/storage
    ports:
      - "5198:8080"

  agent-gateway:
    build:
      context: agent-gateway
      dockerfile: Dockerfile
    container_name: oet-desktop-agent-gateway
    restart: unless-stopped
    environment:
      AGENTGATEWAY_AUTH_MODE: ${AGENTGATEWAY_AUTH_MODE:-gemini-key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENTGATEWAY_INTERNAL_SERVICE_TOKEN: ${AGENTGATEWAY_INTERNAL_SERVICE_TOKEN:-}
      AGENTGATEWAY_BUDGET_TOKENS_PER_DAY: ${AGENTGATEWAY_BUDGET_TOKENS_PER_DAY:-2000000}
      AGENTGATEWAY_CACHE_TTL_SECONDS: ${AGENTGATEWAY_CACHE_TTL_SECONDS:-3600}
      AGENTGATEWAY_MAX_SESSIONS: ${AGENTGATEWAY_MAX_SESSIONS:-8}
      # Resilience hardening (v0.2): same knobs as production; local defaults.
      AGENTGATEWAY_TURN_TIMEOUT_SECONDS: ${AGENTGATEWAY_TURN_TIMEOUT_SECONDS:-120}
      AGENTGATEWAY_CIRCUIT_FAILURE_THRESHOLD: ${AGENTGATEWAY_CIRCUIT_FAILURE_THRESHOLD:-8}
      AGENTGATEWAY_CIRCUIT_COOLDOWN_SECONDS: ${AGENTGATEWAY_CIRCUIT_COOLDOWN_SECONDS:-90}
      AGENTGATEWAY_SSE_KEEPALIVE_SECONDS: ${AGENTGATEWAY_SSE_KEEPALIVE_SECONDS:-15}
      AGENTGATEWAY_DRAIN_TIMEOUT_SECONDS: ${AGENTGATEWAY_DRAIN_TIMEOUT_SECONDS:-15}
      AGENTGATEWAY_REDIS_URL: ${AGENTGATEWAY_REDIS_URL:-}
      AGENTGATEWAY_LOG_JSON: ${AGENTGATEWAY_LOG_JSON:-false}
      # Mode B (personal Antigravity OAuth) is NOT pre-set here: desktop users
      # can home-set AGENTGATEWAY_AUTH_MODE=local-oauth + LOCAL_OAUTH_ALLOWED=true
      # in their own .env for the owner's personal AI Pro quota (opt-in; risk notice
      # in docs/antigravity/auth.md).
      AGENTGATEWAY_LOCAL_OAUTH_ALLOWED: ${AGENTGATEWAY_LOCAL_OAUTH_ALLOWED:-false}
      AGENTGATEWAY_LOCAL_OAUTH_SERVICE: ${AGENTGATEWAY_LOCAL_OAUTH_SERVICE:-gemini}
      AGENTGATEWAY_LOCAL_OAUTH_ACCOUNT: ${AGENTGATEWAY_LOCAL_OAUTH_ACCOUNT:-antigravity}
    ports:
      - "8305:8305"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8305/v1/readyz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/backend
        APP_URL: http://localhost:3000
    container_name: oet-desktop-web
    restart: unless-stopped
    depends_on:
      learner-api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      API_PROXY_TARGET_URL: http://learner-api:8080
      APP_URL: ${OET_PERF_APP_URL:-http://localhost:3000}
      GEMINI_API_KEY: ""
    ports:
      - "3000:3000"

volumes:
  oet_desktop_postgres_data:
  oet_desktop_storage:
