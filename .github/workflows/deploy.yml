name: Build & Deploy (web + API)

# Fresh deploy on every push to main: build the web (Next.js/Turbopack),
# API (.NET), and backup-sidecar images OFF-BOX on GitHub's 16 GB runners,
# push to GHCR, then SSH to the prod VPS which PULLS the images and
# blue/green-redeploys (health-gated
# — a broken commit fails the gate and is NOT promoted, so prod stays up).
#
# Why not build on the VPS: it is a shared host with 60+ co-tenant containers;
# an in-place `next build` OOM-cascades and can take the whole box down.
#
# Uses pre-existing repo secrets: VPS_HOST, VPS_USER, VPS_PORT, VPS_SSH_KEY,
# VPS_APP_DIR. No build minutes are billed (public repo).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

# Serialize deploys so two quick pushes don't flip routers concurrently.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
  API_IMAGE: ghcr.io/${{ github.repository }}-api:${{ github.sha }}
  DB_BACKUP_IMAGE: ghcr.io/${{ github.repository }}-db-backup:${{ github.sha }}

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert production rollout is image-only
        run: |
          bash scripts/deploy/verify-image-only-rollout.sh
          bash scripts/deploy/verify-compute-offload.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
            ghcr.io/${{ github.repository }}-web:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.oetwithdrhesham.co.uk
            APP_URL=https://app.oetwithdrhesham.co.uk
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backup sidecar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/backup/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}-db-backup:${{ github.sha }}
            ghcr.io/${{ github.repository }}-db-backup:latest
          cache-from: type=gha,scope=db-backup
          cache-to: type=gha,mode=max,scope=db-backup

  migrate-production:
    needs: [build-web, build-api, build-backup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install EF command-line tools
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.5
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet ef --version
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Restore API project
        run: dotnet restore backend/src/OetLearner.Api/OetLearner.Api.csproj --nologo
      - name: Build migration generator on GitHub Actions
        run: dotnet build backend/src/OetLearner.Api/OetLearner.Api.csproj --configuration Release --no-restore --nologo
      - name: Generate idempotent production migration SQL off-box
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          mkdir -p output
          dotnet ef migrations script --idempotent --no-build --configuration Release \
            --project backend/src/OetLearner.Api/OetLearner.Api.csproj \
            --startup-project backend/src/OetLearner.Api/OetLearner.Api.csproj \
            --output output/oet-production-migrations.sql
          test -s output/oet-production-migrations.sql
          sha256sum output/oet-production-migrations.sql
      - name: Retain migration artifact for deployment audit
        uses: actions/upload-artifact@v4
        with:
          name: oet-production-migrations-${{ github.sha }}
          path: output/oet-production-migrations.sql
          if-no-files-found: error
          retention-days: 3
      - name: Apply migration SQL through the production PostgreSQL container
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          VPS_HOST: "185.252.233.186"
          VPS_USER: "root"
          VPS_PORT: "22"
          APP_DIR: "/opt/oetwebapp"
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          REMOTE_WRAPPER="/tmp/oet-apply-migrations-${GITHUB_RUN_ID}.sh"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh_opts=(
            -i ~/.ssh/deploy_key -p "$PORT"
            -o IdentitiesOnly=yes -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )
          cleanup() {
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "rm -f '$REMOTE_WRAPPER'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "umask 077; cat > '$REMOTE_WRAPPER'; chmod 700 '$REMOTE_WRAPPER'" \
            < scripts/deploy/apply-migrations-from-ci.sh
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "set -e; VPS_APP_DIR='$APP_DIR' bash '$REMOTE_WRAPPER'" \
            < output/oet-production-migrations.sql

  deploy:
    needs: [build-web, build-api, build-backup, migrate-production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS over SSH (pull + blue/green redeploy)
        env:
          # Dedicated CI deploy key (authorized on the real prod box's root).
          # Cutover 2026-06-05 moved production to MAIN; app/api DNS now resolve
          # to 185.252.233.186. The old 68.183.32.122 box was decommissioned, so
          # host/user/path are hardcoded to current prod (185.252.233.186).
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          VPS_HOST: "185.252.233.186"
          VPS_USER: "root"
          VPS_PORT: "22"
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          APP_DIR="/opt/oetwebapp"
          REMOTE_DIR="/tmp/oet-image-rollout-${GITHUB_RUN_ID}"
          REMOTE_SCRIPT="$REMOTE_DIR/auto-deploy-ghcr.sh"
          REMOTE_COMPOSE="$REMOTE_DIR/docker-compose.production.yml"
          REMOTE_VALIDATE="$REMOTE_DIR/validate-production-env.sh"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh_opts=(
            -i ~/.ssh/deploy_key -p "$PORT"
            -o IdentitiesOnly=yes -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )
          cleanup() {
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
              "rm -f '$REMOTE_SCRIPT' '$REMOTE_COMPOSE' '$REMOTE_VALIDATE'; rmdir '$REMOTE_DIR' 2>/dev/null || true" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "umask 077; mkdir -p '$REMOTE_DIR'; cat > '$REMOTE_SCRIPT'; chmod 700 '$REMOTE_SCRIPT'" \
            < scripts/deploy/auto-deploy-ghcr.sh
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "umask 077; cat > '$REMOTE_COMPOSE'; chmod 600 '$REMOTE_COMPOSE'" \
            < docker-compose.production.yml
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "umask 077; cat > '$REMOTE_VALIDATE'; chmod 700 '$REMOTE_VALIDATE'" \
            < scripts/deploy/validate-production-env.sh
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "set -e; echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin; \
             WEB_IMAGE='$WEB_IMAGE' API_IMAGE='$API_IMAGE' DB_BACKUP_IMAGE='$DB_BACKUP_IMAGE' \
             VPS_APP_DIR='$APP_DIR' VPS_COMPOSE_FILE='$REMOTE_COMPOSE' VPS_VALIDATE_ENV_SCRIPT='$REMOTE_VALIDATE' \
               bash '$REMOTE_SCRIPT'; \
             docker logout ghcr.io >/dev/null 2>&1 || true"
      - name: Summary
        if: always()
        run: |
          echo "### Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- web: \`$WEB_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- api: \`$API_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- backup: \`$DB_BACKUP_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
