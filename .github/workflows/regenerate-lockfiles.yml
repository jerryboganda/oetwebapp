name: Regenerate lockfiles (one-off)

# THROWAWAY (owner decision 2026-09-28: dependency cleanup via CI, no local installs).
# Delete this file once its run has pushed the "[lockfile-bot]" commit.
#
# One run, on the branch below only:
#   - pnpm remove the three unused deps (package.json + pnpm-lock.yaml)
#   - pin the four floating NuGet versions to what `dotnet restore` resolves now
#     (Stripe.net identical in the API and StripeProductSeeder)
#   - generate package-lock.json for agent-console, egress and dockerproxy
# then commits those files and pushes them back to the same branch.
# Loop guard: the paths filter (the bot commit never touches this file), the
# bot-marker check below, and GITHUB_TOKEN pushes never trigger workflows.
# Human commits that touch this file must NOT contain the bot marker in their
# message, or the job skips itself.

on:
  push:
    branches: [chore/deps-lockfiles-2026-09-28]
    paths:
      - '.github/workflows/regenerate-lockfiles.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Remove unused npm deps (pnpm)
        run: pnpm remove @tanstack/react-query-devtools diff-match-patch @types/diff-match-patch

      - name: Pin floating NuGet versions to the resolved ones
        run: |
          set -euo pipefail
          dotnet restore backend/OetLearner.sln --nologo
          dotnet list backend/OetLearner.sln package --format json > "$RUNNER_TEMP/nuget-packages.json"
          PKGS="$RUNNER_TEMP/nuget-packages.json" node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.env.PKGS, 'utf8');
          const report = JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1));
          const floating = { 'AWSSDK.S3': '3.7.*', 'Google.Apis.Auth': '1.*', 'MailKit': '4.*', 'Stripe.net': '47.*' };
          const resolved = {};
          for (const project of report.projects) {
            if (!/[\\/]OetLearner\.Api\.csproj$/.test(project.path)) continue;
            for (const fw of project.frameworks ?? [])
              for (const p of fw.topLevelPackages ?? [])
                if (p.id in floating) resolved[p.id] = p.resolvedVersion;
          }
          for (const [id, range] of Object.entries(floating)) {
            const v = resolved[id];
            if (!v || !/^\d+(\.\d+){1,3}$/.test(v) || !v.startsWith(range.slice(0, -1)))
              throw new Error(`${id}: unexpected resolved version ${v} for ${range}`);
          }
          const files = {
            'backend/src/OetLearner.Api/OetLearner.Api.csproj': Object.keys(floating),
            'backend/scripts/StripeProductSeeder/StripeProductSeeder.csproj': ['Stripe.net'],
          };
          for (const [file, ids] of Object.entries(files)) {
            let text = fs.readFileSync(file, 'utf8');
            for (const id of ids) {
              const from = `Include="${id}" Version="${floating[id]}"`;
              if (text.split(from).length !== 2) throw new Error(`${file}: expected exactly one ${from}`);
              text = text.replace(from, `Include="${id}" Version="${resolved[id]}"`);
              console.log(`${file}: ${id} ${floating[id]} -> ${resolved[id]}`);
            }
            fs.writeFileSync(file, text);
          }
          NODE

      - name: Generate agent-console package-lock.json files
        # Resolve in an empty directory with the package's own .npmrc
        # (legacy-peer-deps), exactly like agent-console.yml's install step:
        # npm inside the repo checkout crashes ("reading 'edgesOut'"). Then prove
        # the lockfile works with `npm ci` before it is committed.
        run: |
          set -euo pipefail
          for dir in agent-console agent-console/egress agent-console/dockerproxy; do
            tmp="$RUNNER_TEMP/lock-$(printf '%s' "$dir" | tr '/' '-')"
            mkdir -p "$tmp"
            cp "$dir/package.json" "$dir/.npmrc" "$tmp/"
            (cd "$tmp" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
            (cd "$tmp" && npm ci --ignore-scripts --no-audit --no-fund)
            cp "$tmp/package-lock.json" "$dir/package-lock.json"
          done

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json pnpm-lock.yaml \
            backend/src/OetLearner.Api/OetLearner.Api.csproj \
            backend/scripts/StripeProductSeeder/StripeProductSeeder.csproj \
            agent-console/package-lock.json \
            agent-console/egress/package-lock.json \
            agent-console/dockerproxy/package-lock.json
          git status --short
          git diff --cached --stat
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m 'chore(deps): regenerate lockfiles and pin NuGet versions [lockfile-bot]'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF}"
