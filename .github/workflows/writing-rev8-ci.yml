name: Writing Rev8 CI

# Validates the Writing "Rule Enforcement & Model Answer Validation Addendum,
# Revision 8" branch on GitHub Actions (the only authorized compute
# environment — see AGENTS.md) and regenerates the canonical Writing
# rulebooks from docs/canonical-rules/OET_AI_Rules_Master.jsonl.
#
# The regenerated rulebooks are uploaded as an artifact and are ALSO what the
# backend and frontend tests run against (the API embeds rulebooks/**/*.json at
# build time; lib/rulebook imports them statically), so a green run describes
# the tree as it will be once the regenerated files are committed.
on:
  push:
    branches:
      - 'ci/writing-rev8/**'
      - 'fix/writing-rev8-rule-enforcement'
  workflow_dispatch:
    inputs:
      dotnet_filter:
        description: "dotnet test --filter expression (blank = Writing/Rulebook default scope)"
        required: false
        default: ""
        type: string
      vitest_paths:
        description: "Space-separated vitest path filters (blank = Writing/rulebook default scope)"
        required: false
        default: ""
        type: string
      review_json:
        description: "Optional sanitized software-review state and typed Jev choice questions (no letters or secrets)"
        required: false
        default: ""
        type: string
      diagnose_submission:
        description: "Optional production submission UUID for read-only operation and provider failure metadata"
        required: false
        default: ""
        type: string
      qa_source_submission:
        description: "Owned source submission UUID for live QA; the original submission is not changed"
        required: false
        default: ""
        type: string
      qa_retry_submission:
        description: "Owner-authorized existing failed QA UUID to resume once; no new letter"
        required: false
        default: ""
        type: string
      verify_subscription_grading:
        description: "Owner-authorized one-assessment live QA; temporarily use Codex subscription and restore provider mode"
        required: false
        default: false
        type: boolean
      verify_production_report:
        description: "Read-only real browser check against the live site; no submission, model call, or credit debit"
        required: false
        default: false
        type: boolean
      qa_report_submission:
        description: "Owned already-graded production submission UUID for the read-only browser check"
        required: false
        default: ""
        type: string
      diagnose_latest_failures:
        description: "Read-only: rank why the latest Writing grades failed (no UUID needed): operations, usage, providers, circuits, budgets, policy, failed learners' credit ledger"
        required: false
        default: false
        type: boolean
      verify_api_model:
        description: "Owner-authorised ONE ~$0.01 paid Anthropic test-model call (Level 2 model id proof); stops when the API has no credit"
        required: false
        default: false
        type: boolean
      probe_subscription_providers:
        description: "With diagnose_latest_failures: a 1-token test of the Claude Max and Codex SUBSCRIPTION sidecars ($0; never the paid API)"
        required: false
        default: false
        type: boolean
      clear_max_marker:
        description: "RULE MAX-ALWAYS-ON: clear the legacy 7-day Claude Max exhaustion marker so Max is tried first again (admin write, no AI call)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: writing-rev8-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-report-qa:
    name: Live production Writing report (read-only browser)
    if: ${{ inputs.verify_production_report == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live QA script syntax
        run: node --check scripts/qa/writing-grading-live.mjs
      - name: Install isolated production browser
        run: |
          mkdir -p "$RUNNER_TEMP/writing-browser"
          npm install --prefix "$RUNNER_TEMP/writing-browser" --no-package-lock --no-save playwright@1.58.2
          "$RUNNER_TEMP/writing-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify live redirect, six criteria, and desktop/mobile refresh
        env:
          VERIFY_PRODUCTION_REPORT: "true"
          REPORT_SUBMISSION_ID: ${{ inputs.qa_report_submission }}
          QA_EMAIL: ${{ secrets.OET_WRITING_INCIDENT_LEARNER_EMAIL }}
          QA_PASSWORD: ${{ secrets.OET_WRITING_INCIDENT_LEARNER_PASSWORD }}
        run: |
          cp scripts/qa/writing-grading-live.mjs "$RUNNER_TEMP/writing-browser/check.mjs"
          node "$RUNNER_TEMP/writing-browser/check.mjs"

  production-grading-qa:
    name: Authorized subscription-only Writing QA
    if: ${{ inputs.verify_subscription_grading == true && inputs.verify_production_report != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify persisted grade report and idempotent retry
        env:
          ADMIN_EMAIL: ${{ secrets.OET_WRITING_INCIDENT_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.OET_WRITING_INCIDENT_ADMIN_PASSWORD }}
          QA_EMAIL: ${{ secrets.OET_WRITING_INCIDENT_LEARNER_EMAIL }}
          QA_PASSWORD: ${{ secrets.OET_WRITING_INCIDENT_LEARNER_PASSWORD }}
          TARGET_SUBMISSION_ID: ${{ inputs.qa_source_submission }}
          RETRY_SUBMISSION_ID: ${{ inputs.qa_retry_submission }}
        run: node scripts/qa/writing-grading-live.mjs

  production-diagnostics:
    name: Read-only Writing failure diagnostics
    if: ${{ inputs.diagnose_submission != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read operation and provider failure metadata
        env:
          SUBMISSION_ID: ${{ inputs.diagnose_submission }}
          ADMIN_EMAIL: ${{ secrets.OET_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.OET_ADMIN_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const id = process.env.SUBMISSION_ID;
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) {
            throw new Error('A submission UUID is required');
          }
          if (!process.env.ADMIN_EMAIL || !process.env.ADMIN_PASSWORD) throw new Error('CI admin credentials unavailable');
          const base = 'https://api.oetwithdrhesham.co.uk';
          const login = await fetch(`${base}/v1/auth/sign-in`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-OET-Client-Platform': 'web' },
            body: JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD, rememberMe: false }),
            signal: AbortSignal.timeout(30000),
          });
          const session = await login.json();
          if (!login.ok || !session.accessToken) {
            throw new Error(`Admin sign-in failed: HTTP ${login.status} (${session.errorCode ?? session.code ?? 'no_session'})`);
          }
          const headers = { Authorization: `Bearer ${session.accessToken}` };
          async function read(path) {
            const response = await fetch(`${base}${path}`, { headers, signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error(`Read-only diagnostic failed: HTTP ${response.status} on ${path}`);
            return response.json();
          }
          const [operations, usage, circuits, budgets] = await Promise.all([
            read('/v1/admin/ai/operations?featureCode=writing.grade&pageSize=200'),
            read('/v1/admin/ai/usage?featureCode=writing.grade&pageSize=100'),
            read('/v1/admin/ai/circuits'),
            read('/v1/admin/ai/budgets'),
          ]);
          const matches = operations.rows.filter(row => String(row.resourceId ?? '').replaceAll('-', '') === id.replaceAll('-', ''));
          const userIds = new Set(matches.map(row => row.userId));
          console.log('SUBMISSION_OPERATIONS', JSON.stringify(matches.map(row => ({
            id: row.id, state: row.state, featureCode: row.featureCode, createdAt: row.createdAt,
            updatedAt: row.updatedAt, hasResult: Boolean(row.resultRef),
          }))));
          if (matches.length === 0) {
            console.log('RECENT_WRITING_OPERATIONS', JSON.stringify(operations.rows.slice(0, 30).map(row => ({
              resourceId: row.resourceId, state: row.state, createdAt: row.createdAt, hasResult: Boolean(row.resultRef),
            }))));
          }
          const errorSignals = ['model_not_found', 'unsupported_model', 'invalid_model', 'not supported', 'does not exist',
            'quota_exceeded', 'insufficient_quota', 'credentials_missing', 'unauthorized', 'invalid_api_key',
            'ECONNREFUSED', 'ETIMEDOUT', 'ENOTFOUND', 'spawn', 'ENOENT', 'not logged in', 'codex_error',
            'invalid_grant', '401', '403', '404', '429', '502', '503'];
          console.log('WRITING_USAGE', JSON.stringify(usage.rows.filter(row => userIds.size === 0 || userIds.has(row.userId)).slice(0, 30).map(row => ({
            id: row.id, providerId: row.providerId, model: row.model, outcome: row.outcome,
            errorCode: row.errorCode, latencyMs: row.latencyMs, retryCount: row.retryCount,
            promptTokens: row.promptTokens, completionTokens: row.completionTokens, createdAt: row.createdAt,
            errorSignals: errorSignals.filter(signal => String(row.errorMessage ?? '').toLowerCase().includes(signal.toLowerCase())),
          }))));
          console.log('PROVIDER_CIRCUITS', JSON.stringify(circuits.rows.filter(row => row.kind === 'provider').map(row => ({
            key: row.key, state: row.state, failureCount: row.failureCount, lastFailureCode: row.lastFailureCode,
          }))));
          console.log('BUDGETS', JSON.stringify(budgets.rows.map(row => ({
            scope: row.scope, periodKey: row.periodKey,
            exhausted: row.limit > 0 && row.reserved + row.committed >= row.limit,
          }))));
          NODE

  production-latest-diagnostics:
    name: Read-only Writing grading diagnostics (latest failures)
    if: ${{ inputs.diagnose_latest_failures == true || inputs.verify_api_model == true || inputs.clear_max_marker == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/qa
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check diagnostics script syntax
        run: node --check scripts/qa/writing-prod-diagnose.mjs
      # One admin sign-in (it signs other admin sessions out). Read-only except
      # the single owner-authorised test-model call when verify_api_model is set.
      - name: Rank the latest Writing grade failures
        env:
          ADMIN_EMAIL: ${{ secrets.OET_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.OET_ADMIN_PASSWORD }}
          DIAGNOSE_LATEST: ${{ inputs.diagnose_latest_failures }}
          VERIFY_API_MODEL: ${{ inputs.verify_api_model }}
          PROBE_SUBSCRIPTION_PROVIDERS: ${{ inputs.probe_subscription_providers }}
          CLEAR_MAX_MARKER: ${{ inputs.clear_max_marker }}
        run: node scripts/qa/writing-prod-diagnose.mjs

  software-review:
    name: Jev typed software review (AI Gateway)
    if: ${{ inputs.review_json != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated review SDK
        run: npm install --prefix "$RUNNER_TEMP/jev-review" --no-package-lock --no-save ai@7.0.107
      - name: Evaluate and validate typed judgments
        working-directory: ${{ runner.temp }}/jev-review
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          REVIEW_JSON: ${{ inputs.review_json }}
        run: |
          node --input-type=module <<'NODE'
          import { experimental_evaluate } from 'ai';
          if (!process.env.AI_GATEWAY_API_KEY) throw new Error('AI Gateway key is unavailable');
          const request = JSON.parse(process.env.REVIEW_JSON);
          if (!request.state || !request.questions) throw new Error('Review state and questions are required');
          for (const question of Object.values(request.questions)) {
            if (question.type !== 'choice' || !question.instructions || !question.criteria) {
              throw new Error('Only explicit typed choice questions are supported');
            }
          }
          const result = await experimental_evaluate({
            model: 'typesafe-ai/jev',
            state: request.state,
            questions: request.questions,
            abortSignal: AbortSignal.timeout(30000),
          });
          console.log(JSON.stringify({ model: 'typesafe-ai/jev', answers: result.answers }));
          for (const [id, question] of Object.entries(request.questions)) {
            const answer = result.answers[id];
            if (answer?.type !== 'choice' || !Object.hasOwn(question.criteria, answer.choice)
                || !Number.isFinite(answer.confidence) || answer.confidence < 0.75
                || !Number.isFinite(answer.probabilities?.[answer.choice])
                || answer.probabilities[answer.choice] < 0.8
                || answer.choice === 'insufficient_evidence') {
              throw new Error(`Uncertain or invalid judgment for ${id}; decision paused`);
            }
          }
          NODE

  rulebooks:
    name: Canonical Writing rulebooks (build + --check)
    if: ${{ inputs.verify_production_report != true && inputs.diagnose_latest_failures != true && inputs.verify_api_model != true && inputs.clear_max_marker != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate canonical Writing rulebooks
        run: node scripts/rulebooks/build-canonical-writing-rulebooks.mjs
      - name: Verify regenerated output is stable (--check)
        run: node scripts/rulebooks/build-canonical-writing-rulebooks.mjs --check
      # Informational only: the regenerated files are expected to differ from
      # the committed ones until they are committed.
      - name: Diff vs committed rulebooks
        run: git diff --stat -- rulebooks/writing
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-writing-rulebooks
          path: rulebooks/writing/*/rulebook.v1.json
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend Writing/Rulebook tests (.NET)
    if: ${{ inputs.verify_production_report != true && inputs.diagnose_latest_failures != true && inputs.verify_api_model != true && inputs.clear_max_marker != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No Postgres service: [PostgreSqlFact] tests self-skip without
    # OET_TEST_POSTGRES_CONNECTION.
    env:
      DOTNET_FILTER: ${{ inputs.dotnet_filter || 'FullyQualifiedName~OetLearner.Api.Tests.Rulebook.|FullyQualifiedName~OetLearner.Api.Tests.Writing.' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore test project
        run: dotnet restore backend/tests/OetLearner.Api.Tests/OetLearner.Api.Tests.csproj
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Must run before the build below: the API embeds rulebooks/**/*.json.
      - name: Regenerate canonical Writing rulebooks
        run: node scripts/rulebooks/build-canonical-writing-rulebooks.mjs
      - name: Test
        run: |
          set -euo pipefail
          dotnet test backend/tests/OetLearner.Api.Tests/OetLearner.Api.Tests.csproj \
            -c Release \
            --no-restore \
            --nologo \
            -p:RunAnalyzers=false \
            --filter "$DOTNET_FILTER" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=results.trx" \
            --results-directory test-results \
            2>&1 | tee test.log
          # A filter that matches nothing exits 0 — refuse that as a pass.
          if ! grep -Eiq 'total( tests)?: *[1-9]' test.log; then
            echo "::error::The test filter matched zero tests: $DOTNET_FILTER"
            exit 1
          fi
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writing-rev8-backend-test-results
          path: |
            test-results/
            test.log
          if-no-files-found: ignore
          retention-days: 7

  backend-build:
    name: Backend compile gate (whole solution)
    if: ${{ inputs.verify_production_report != true && inputs.diagnose_latest_failures != true && inputs.verify_api_model != true && inputs.clear_max_marker != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (API + all test code)
        run: dotnet build backend/OetLearner.sln -c Release -p:RunAnalyzers=false --nologo

  frontend:
    name: Frontend (tsc + scoped vitest + changed-file lint)
    if: ${{ inputs.verify_production_report != true && inputs.diagnose_latest_failures != true && inputs.verify_api_model != true && inputs.clear_max_marker != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITEST_PATHS: ${{ inputs.vitest_paths || 'lib/rulebook app/(learner)/writing components/domain/writing components/domain/InsufficientCreditsModal' }}
    steps:
      # Full commit graph (blobless, so still cheap) for the merge-base diff
      # that scopes the lint step to files this branch changed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lib/rulebook imports rulebooks/writing/*/rulebook.v1.json statically;
      # type-check and test against the regenerated copies, like the backend.
      - name: Regenerate canonical Writing rulebooks
        run: node scripts/rulebooks/build-canonical-writing-rulebooks.mjs
      - run: pnpm exec tsc --noEmit
      # Vitest ORs its path filters and only fails when none match, so a filter
      # with no test file yet (e.g. InsufficientCreditsModal) is harmless.
      - name: Vitest (scoped)
        run: |
          set -euo pipefail
          read -ra paths <<< "$VITEST_PATHS"
          pnpm exec vitest run "${paths[@]}"
      # Lints only frontend files this branch changed vs main, so pre-existing
      # lint debt in untouched files never fails this workflow.
      - name: ESLint (changed frontend files)
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          mapfile -t files < <(git diff --name-only --no-renames --diff-filter=d "$base" HEAD -- app components contexts hooks lib | grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed frontend files to lint."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          pnpm exec eslint "${files[@]}"
