name: speaking-audio-probe

# Release gate for the Speaking audio judge (owner spec 4 Oct 2026; docs/speaking/scoring.md).
# Manual only. All compute (speech synthesis, the probe script) runs here, never on the workstation or the VPS.
# The clips are synthetic, so no learner audio is involved: a speech synthesiser reads a known phrase, ffmpeg makes
# a noise-only clip and a copy of the speech buried in noise, and different-language voices reading the English phrase
# give accented clips that are printed for information only (a synthetic voice is fully intelligible, so they cannot gate).

on:
  workflow_dispatch:
    inputs:
      phrase:
        description: 'The phrase both clips speak (a dozen words or more, not from any prompt)'
        required: false
        default: 'Good afternoon, my name is Doctor Okafor and I will be looking after you today.'

permissions:
  contents: read

concurrency:
  group: speaking-audio-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make the probe clips
        env:
          PHRASE: ${{ inputs.phrase }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          espeak-ng -v en-us -s 150 -w clean.wav "$PHRASE"
          for voice in de es fr; do espeak-ng -v "$voice" -s 150 -w "accented-$voice.wav" "$PHRASE"; done
          # No speech at all: five seconds of pink noise.
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "anoisesrc=d=5:c=pink:a=0.3" -ar 16000 -ac 1 noise.wav
          # The same speech buried in noise and cut to a telephone-like band.
          ffmpeg -hide_banner -loglevel error -y -i clean.wav -f lavfi -i "anoisesrc=d=12:c=white:a=0.6" \
            -filter_complex "[0:a]volume=0.5[s];[s][1:a]amix=inputs=2:duration=first:weights='1 1.8',highpass=f=300,lowpass=f=2400[out]" \
            -map "[out]" -ar 16000 -ac 1 degraded.wav
          ls -l clean.wav noise.wav degraded.wav accented-*.wav

      - name: Probe the production audio judge
        env:
          OET_ADMIN_EMAIL: ${{ secrets.OET_ADMIN_EMAIL }}
          OET_ADMIN_PASSWORD: ${{ secrets.OET_ADMIN_PASSWORD }}
          PHRASE: ${{ inputs.phrase }}
        run: node scripts/speaking/audio-probe.mjs --clean clean.wav --noise noise.wav --degraded degraded.wav --accented accented-de.wav,accented-es.wav,accented-fr.wav --phrase "$PHRASE"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speaking-audio-probe-${{ github.run_id }}
          path: audio-probe-result.json
          if-no-files-found: ignore
          retention-days: 30
