# MANUAL TOOL, INERT: used manually by the owner on a self-provisioned staging host; no CI runs this;
# agents never run it (AGENTS.md "NO AUTOMATED QA ANYWHERE"). Runbook: docs/ops/LOAD-TESTING.md.
#
# Overlay for the NON-production load-test stack (docker-compose.staging.yml). It adds the provider
# simulators and points the staging API at them. It is NEVER run on the primary production VPS or
# beside production containers: the load harness aims at a dedicated staging host (see
# docs/ops/LOAD-TESTING.md), and the container names below (oet-writing-claude / oet-writing-codex)
# would collide with the production Writing sidecars.
#
# From the repository root on the staging host (images are pulled, never built there):
#   export API_IMAGE=ghcr.io/jerryboganda/oetwebapp-api:<sha> WEB_IMAGE=ghcr.io/jerryboganda/oetwebapp-web:<sha>
#   docker compose --env-file .env.staging \
#     -f docker-compose.staging.yml -f tests/load/sut/docker-compose.load-overrides.yml up -d --no-build
#
# What runs here:
#   provider-sim          OpenAI GPT-Live, Gemini Live and LiveKit (Twirp + signed webhooks) stand-ins
#   writing-claude-sim    the REAL writing-ai-sidecars/claude/server.mjs with a stub `claude` CLI
#   writing-codex-sim     the REAL writing-ai-sidecars/codex/server.mjs with a stub `codex` CLI
# The two writing sidecars keep their real lane (concurrency 1, queue 40, 7-minute wait), so the
# actual Writing-grading bottleneck is what the run exercises; only the vendor call is a sleep.
#
# Security posture is NOT relaxed: SingleActiveSessionEnabled and TrustedDeviceRequired stay on.

x-sidecar: &sidecar
  image: node:22-alpine
  restart: unless-stopped
  working_dir: /app
  volumes:
    - ${LOAD_SIDECARS_DIR:-./writing-ai-sidecars}:/app:ro
    - ${LOAD_SIM_DIR:-./tests/load/simulators}:/sim:ro
  environment:
    NODE_ENV: production
    PORT: "8080"
    WRITING_CLI_TIMEOUT_MS: ${WRITING_CLI_TIMEOUT_MS:-300000}
    WRITING_QUEUE_MAX: ${WRITING_QUEUE_MAX:-40}
    WRITING_QUEUE_WAIT_MS: ${WRITING_QUEUE_WAIT_MS:-420000}
    WRITING_LANE_CONCURRENCY: ${WRITING_LANE_CONCURRENCY:-1}
    # How long one simulated grade takes. Max reasoning is slow; 20 s is a deliberately modest value.
    SIM_LLM_LATENCY_MS: ${LOAD_LLM_LATENCY_MS:-20000}
    SIM_LLM_JITTER_MS: ${LOAD_LLM_JITTER_MS:-5000}
    SIM_LLM_FAIL_RATE: ${LOAD_LLM_FAIL_RATE:-0}
  labels:
    oet.load-test: "true"

services:
  provider-sim:
    image: node:22-alpine
    container_name: oet-load-sim
    restart: unless-stopped
    working_dir: /sim
    command: ["node", "/sim/provider-sim.mjs"]
    environment:
      SIM_PORT: "9100"
      SIM_LATENCY_MS: ${LOAD_PROVIDER_LATENCY_MS:-150}
      SIM_JITTER_MS: ${LOAD_PROVIDER_JITTER_MS:-50}
      SIM_FAIL_RATE: ${LOAD_PROVIDER_FAIL_RATE:-0}
      SIM_LIVEKIT_API_KEY: ${LOAD_LIVEKIT_API_KEY:-load-sim-key}
      SIM_LIVEKIT_API_SECRET: ${LOAD_LIVEKIT_API_SECRET:-load-sim-secret-load-sim-secret-0000}
      SIM_WEBHOOK_URL: http://learner-api:8080/v1/speaking/live-rooms/webhooks/livekit
      SIM_ROOM_LIFETIME_S: ${LOAD_ROOM_LIFETIME_S:-420}
    volumes:
      - ${LOAD_SIM_DIR:-./tests/load/simulators}:/sim:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9100/sim/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      internal:
        aliases: [oet-sim]
    labels:
      oet.load-test: "true"

  writing-claude-sim:
    <<: *sidecar
    container_name: oet-writing-claude
    hostname: oet-writing-claude
    command: ["sh", "-c", "node /sim/cli-stubs/install-shims.mjs /tmp/sim-bin >/dev/null && PATH=/tmp/sim-bin:$$PATH exec node /app/claude/server.mjs"]
    networks:
      internal:
        aliases: [oet-writing-claude]

  writing-codex-sim:
    <<: *sidecar
    container_name: oet-writing-codex
    hostname: oet-writing-codex
    command: ["sh", "-c", "node /sim/cli-stubs/install-shims.mjs /tmp/sim-bin >/dev/null && PATH=/tmp/sim-bin:$$PATH exec node /app/codex/server.mjs"]
    networks:
      internal:
        aliases: [oet-writing-codex]

  # The release artifacts under test, pulled from GHCR (pull-only, exactly as production does; the
  # staging host never compiles anything). API_IMAGE / WEB_IMAGE are
  # ghcr.io/jerryboganda/oetwebapp-api:<sha> and ghcr.io/jerryboganda/oetwebapp-web:<sha> of the commit
  # under test. Start with `up -d --no-build` so the `build:` blocks of the staging file are never used.
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to the GHCR web image of the commit under test}
    pull_policy: always

  # Merged into the staging API service: the image, provider endpoints and the SSRF allow-list for the sidecars.
  learner-api:
    image: ${API_IMAGE:?set API_IMAGE to the GHCR API image of the commit under test}
    pull_policy: always
    environment:
      LiveVoice__PrimaryProvider: openai
      LiveVoice__OpenAiApiKey: load-sim-openai-key
      LiveVoice__OpenAiBaseUrl: http://oet-sim:9100/openai/v1/live/sessions
      LiveVoice__OpenAiModelsBaseUrl: http://oet-sim:9100/openai/v1/models
      LiveVoice__GeminiApiKey: load-sim-gemini-key
      LiveVoice__GeminiBaseUrl: http://oet-sim:9100/gemini/v1beta/auth_tokens
      LiveVoice__GeminiModelsBaseUrl: http://oet-sim:9100/gemini/v1beta/models
      LiveVoice__GeminiWebSocketBaseUrl: ws://oet-sim:9100/gemini/ws
      LiveKit__Provider: livekit_cloud
      LiveKit__ApiKey: ${LOAD_LIVEKIT_API_KEY:-load-sim-key}
      LiveKit__ApiSecret: ${LOAD_LIVEKIT_API_SECRET:-load-sim-secret-load-sim-secret-0000}
      LiveKit__WebhookSigningSecret: ${LOAD_LIVEKIT_API_SECRET:-load-sim-secret-load-sim-secret-0000}
      LiveKit__WssUrl: ws://oet-sim:9100
      LiveKit__EgressEnabled: "true"
      LiveKit__EgressBucket: s3://oet-load-sim
      LiveKit__EgressAccessKey: load-sim-egress-key
      LiveKit__EgressSecret: load-sim-egress-secret
      LiveKit__EgressEndpoint: http://oet-sim:9100
      OET_INTERNAL_AI_HOSTS: oet-writing-claude,oet-writing-codex
