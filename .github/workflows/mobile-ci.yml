name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'lib/mobile/**'
      - 'lib/auth-client.ts'
      - 'lib/auth-routes.ts'
      - 'lib/auth/**'
      - 'lib/auth-storage.ts'
      - 'contexts/auth-context.tsx'
      - 'components/auth/**'
      - 'app/(auth)/**'
      - 'components/mobile/**'
      - 'app/providers.tsx'
      - 'app/providers/**'
      - 'components/shell/**'
      - 'components/videos/**'
      - 'components/domain/catalog/promo-hero-slider.tsx'
      - 'contexts/accessibility-context.tsx'
      - 'hooks/use-media-preferences.ts'
      - 'lib/query/**'
      - 'tests/performance/**'
      - 'playwright.performance.config.ts'
      - '.github/workflows/mobile-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'lib/mobile/**'
      - 'lib/auth-client.ts'
      - 'lib/auth-routes.ts'
      - 'lib/auth/**'
      - 'lib/auth-storage.ts'
      - 'contexts/auth-context.tsx'
      - 'components/auth/**'
      - 'app/(auth)/**'
      - 'components/mobile/**'
      - 'app/providers.tsx'
      - 'app/providers/**'
      - 'components/shell/**'
      - 'components/videos/**'
      - 'components/domain/catalog/promo-hero-slider.tsx'
      - 'contexts/accessibility-context.tsx'
      - 'hooks/use-media-preferences.ts'
      - 'lib/query/**'
      - 'tests/performance/**'
      - 'playwright.performance.config.ts'
      - '.github/workflows/mobile-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Capacitor 7 Android compiles against Java 21 (source/target release 21);
  # JDK 17 fails with "invalid source release: 21".
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ── Lint & Type Check ──────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm run lint

  # ── Mobile Unit Tests ──────────────────────────────────────────
  unit-tests:
    name: Mobile Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run mobile unit tests
        run: pnpm exec vitest run --reporter=verbose lib/mobile/ components/mobile/

  # ── Android Debug Build ────────────────────────────────────────
  android-build:
    name: Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build
        env:
          CAPACITOR_APP_URL: https://app.oetwithdrhesham.co.uk

      - name: Capacitor sync
        run: pnpm exec cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  android-runtime-smoke:
    name: Android Emulator Runtime Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: android-build
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: output/native/android

      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            # android-emulator-runner invokes this block with POSIX sh, not
            # Bash. Keep strict mode portable so the runtime smoke reaches
            # the install/launch assertions on every hosted runner.
            set -eu
            mkdir -p "$GITHUB_WORKSPACE/output/native/android"
            adb install -r "$GITHUB_WORKSPACE/output/native/android/app-debug.apk"
            adb shell am force-stop com.oetprep.learner
            adb shell am start -W -n com.oetprep.learner/.MainActivity
            attempt=1; while [ "$attempt" -le 20 ]; do if adb shell pidof com.oetprep.learner | grep -q '[0-9]'; then break; fi; [ "$attempt" -eq 20 ] && { echo 'Android app did not stay alive after launch.' >&2; exit 1; }; attempt=$((attempt + 1)); sleep 1; done
            adb shell pidof com.oetprep.learner
            adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/output/native/android/activity.txt"
            grep -q 'com.oetprep.learner/.MainActivity' "$GITHUB_WORKSPACE/output/native/android/activity.txt"
            adb logcat -d -t 1000 -s AndroidRuntime:E > "$GITHUB_WORKSPACE/output/native/android/logcat.txt" || true
            if grep -Eq 'FATAL EXCEPTION|Process: com.oetprep.learner' "$GITHUB_WORKSPACE/output/native/android/logcat.txt"; then echo 'Android app crash signature detected.' >&2; exit 1; fi

      - name: Upload Android runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-smoke-${{ github.run_id }}
          path: output/native/android
          if-no-files-found: warn
          retention-days: 14

  # ── iOS Build Check ────────────────────────────────────────────
  ios-build:
    name: iOS Build Check
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build
        env:
          CAPACITOR_APP_URL: https://app.oetwithdrhesham.co.uk

      - name: Capacitor sync
        run: pnpm exec cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Build iOS (no code sign)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/AppDerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Launch app on iOS simulator
        id: ios_simulator
        working-directory: ios/App
        run: |
          set -euo pipefail
          device_udid=$(node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const devices = JSON.parse(execFileSync('xcrun', ['simctl', 'list', 'devices', 'available', '-j'], { encoding: 'utf8' })).devices;
          const device = Object.values(devices).flat().find((candidate) => candidate.isAvailable && /^iPhone\b/.test(candidate.name));
          if (!device) throw new Error('No available iPhone simulator was found on the runner.');
          process.stdout.write(device.udid);
          NODE
          )
          echo "device_udid=$device_udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$device_udid" -b
          xcrun simctl install "$device_udid" "$RUNNER_TEMP/AppDerivedData/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$device_udid" com.oetprep.learner
          sleep 10
          xcrun simctl listapps "$device_udid" | grep -q 'com.oetprep.learner'
          xcrun simctl io "$device_udid" screenshot "$RUNNER_TEMP/oet-ios-simulator.png"

      - name: Upload iOS simulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-runtime-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/oet-ios-simulator.png
          if-no-files-found: warn
          retention-days: 14

      - name: Shut down iOS simulator
        if: always() && steps.ios_simulator.outputs.device_udid != ''
        run: xcrun simctl shutdown "${{ steps.ios_simulator.outputs.device_udid }}" || true
