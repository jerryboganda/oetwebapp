name: SBOM and SCA

on:
  # Dependency-surface changes only (owner directive 2026-10-03): a docs/code
  # push that touches no dependency or image definition has nothing new for
  # SBOM/SCA to say. The weekly run still catches newly-published advisories.
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'backend/**/*.csproj'
      - 'backend/Directory.*.props'
      - 'Directory.*.props'
      - 'global.json'
      - 'Dockerfile'
      - 'backend/Dockerfile*'
      - 'scripts/backup/Dockerfile'
      - 'agent-gateway/Dockerfile'
      - 'scripts/sbom-generate.sh'
      - 'scripts/sca-scan.sh'
      - '.github/workflows/sbom-sca.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'backend/**/*.csproj'
      - 'backend/Directory.*.props'
      - 'Directory.*.props'
      - 'global.json'
      - 'Dockerfile'
      - 'backend/Dockerfile*'
      - 'scripts/backup/Dockerfile'
      - 'agent-gateway/Dockerfile'
      - 'scripts/sbom-generate.sh'
      - 'scripts/sca-scan.sh'
      - '.github/workflows/sbom-sca.yml'
  schedule:
    # Monday 06:00 UTC - drift check, no push required.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      fail_on:
        description: Vulnerability severity threshold for grype
        required: false
        default: high

concurrency:
  group: sbom-sca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom-sca:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate SBOM
        env:
          SBOM_OUTPUT: sbom-sca-artifacts/sbom.json
        run: bash scripts/sbom-generate.sh

      - name: Run SCA scan
        env:
          SBOM_OUTPUT: sbom-sca-artifacts/sbom.json
          SCA_OUTPUT: sbom-sca-artifacts/sca.json
          SCA_FAIL_ON: ${{ inputs.fail_on || 'high' }}
        run: bash scripts/sca-scan.sh

      - name: Upload SBOM/SCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-sca-${{ github.sha }}
          path: sbom-sca-artifacts/
          if-no-files-found: error
